// ============================================================================
// Add comforts
// ============================================================================

PARTUPGRADE:NEEDS[RP-0,FeatureComfort]
{
  name = Upgrade-Colony
  partIcon = crewCabin
  techRequired = improvedHabitats
  title = Permanent habitation
  manufacturer = Mesmer and Ize
  description = Thanks to advancements in virtual reality, digital entertainment and human health and psychology studies, permanent habitation is now possible. Some form of gravity is still required, so being landed or using a centrifuge is a necessity, together with the best crew quarters and exercise equipment.
}

@PART[*]:HAS[@MODULE[GravityRing]]:NEEDS[ProfileRealismOverhaul,FeatureComfort]:AFTER[zzzKerbalism]
{
    MODULE
    {
        name = Sickbay
        resource = _SickbayOrbital

        title = Comforts
        desc = A dedicated facility to let astronauts recover from their journey through microgravity. With access to proper showers, laundry and a gym, the crew is sure to enjoy their stay here. Relieves up to 30% of the normal stress build-up for the crew of this part, but note that smaller rings give less gravity at a comfortable spin and relieve less. On a full-size ring (43 m or more across), combined with Near Future Quarters and exercise equipment, stress stops building up entirely but does not decrease. <b>Less comfort or room still lets some stress build up.</b>
        capacity = #$/CrewCapacity$ // scaled by ring size below
        slots = 0

        UPGRADES
        {
            UPGRADE
            {
                name__ = Upgrade-Colony
                techRequired__ = improvedHabitats
                cureEverybody = True
                slots = 1
            }
        }
    }
}

// Provide stress cure based on ring diameter
@PART[kerbalism-gravityring|SSTU-ST-CFG-A]:HAS[@MODULE[Sickbay]:HAS[#resource[_SickbayOrbital]]]:NEEDS[ProfileRealismOverhaul,FeatureComfort]:AFTER[zzzKerbalism]
{
    @MODULE[Sickbay]:HAS[#resource[_SickbayOrbital]]
    {
        @capacity *= 0.2333 // 7%
        @desc ^= :up to 30%:7%:
    }
}
