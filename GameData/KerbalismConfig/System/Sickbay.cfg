@PART[*]:HAS[#CrewCapacity[>3],@MODULE[Habitat],!MODULE[GravityRing],!MODULE[ModuleCommand],!MODULE[Laboratory],!MODULE[LaunchClamp],!MODULE[ModuleUnpressurizedCockpit]]:NEEDS[ProfileRealismOverhaul,FeatureComfort]:AFTER[zzzKerbalism]
{
    MODULE
    {
        name = Sickbay
        resource = _SickbayColony

        title = Rest Facility
        desc = Gravity, real showers, a galley, a gym and relaxed water use on solid ground relieve 30% of the normal stress build-up for the whole crew. Together with Near Future Quarters and exercise equipment, stress stops building up and the crew can stay indefinitely, but it barely goes down. <b>Less comfort or room still lets some stress build up.</b>
        capacity = #$/CrewCapacity$
        slots = 0

        UPGRADES
        {
            UPGRADE
            {
                name__ = Upgrade-Colony
                techRequired__ = improvedHabitats
                cureEverybody = True
                slots = 1
            }
        }
    }
}

// Relieve some stress through comforts (exercising, having plants, panorama, etc.) to decrease (but not cure!) stress build up
@PART[*]:HAS[@MODULE[Comfort]:HAS[#bonus[exercise]],#CrewCapacity[>0]]:NEEDS[ProfileRealismOverhaul,FeatureComfort]:FINAL
{
    MODULE
    {
        name = Sickbay
        resource = _ComfortExercise
        title = Exercise relief
        desc = The crew in this part is able to exercise regularly. This relieves 3% of the normal stress build-up. <b>Start it in flight, and again after crew changes or EVAs.</b>
        capacity = #$/CrewCapacity$
        slots = 1
        cureEverybody = True
    }
    @tags ^=:$:, sickbay, stress, comfort
}

@PART[*]:HAS[@MODULE[Comfort]:HAS[#bonus[panorama]],#CrewCapacity[>0]]:NEEDS[ProfileRealismOverhaul,FeatureComfort]:FINAL
{
