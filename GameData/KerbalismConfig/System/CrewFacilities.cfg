// ============================================================================
// Add optional crew facilities which can be used to reduce stress input and, when combined with other stress comforts/reductions, can freeze stress at the max tier.
// ============================================================================

// Which parts get Crew Facilities: habitats with seats that are not command pods, labs, clamps or open cockpits...
@PART[*]:HAS[@MODULE[Habitat],#CrewCapacity[>0],!MODULE[ModuleCommand],!MODULE[Laboratory],!MODULE[LaunchClamp],!MODULE[ModuleUnpressurizedCockpit]]:NEEDS[ProfileRealismOverhaul,FeatureComfort]:FINAL
{
	%crewFacilities = true
}
@PART[sspx-core-*]:HAS[@MODULE[Habitat],#CrewCapacity[>0]]:NEEDS[ProfileRealismOverhaul,FeatureComfort]:FINAL
{
	%crewFacilities = true
}

@PART[*]:HAS[#crewFacilities[true]]:NEEDS[ProfileRealismOverhaul,FeatureComfort]:FINAL
{
	@tags ^=:$:, sickbay, stress, quarters, habitation
	MODULE
	{
		name = Sickbay
		resource = _QuartersBasic
		title = Spartan Quarters
		desc = Our astronauts will be able to call their family and friends, as well as spend some much desired private time. This relieves 2% of the normal stress build-up. <b>Start it in flight, and again after crew changes or EVAs.</b>
		capacity = #$/CrewCapacity$
		slots = 1
		cureEverybody = True
	}
	MODULE
	{
		name = Sickbay
		resource = _QuartersExpanded
		title = Expanded Quarters
		desc = Our astronauts can make use of expanded amenities, such as more room to retreat for rest, as well as some exercise equipment, a TV set and some instruments. This relieves 27% of the normal stress build-up. <b>Start it in flight, and again after crew changes or EVAs.</b>
		capacity = #$/CrewCapacity$
		slots = 1
		cureEverybody = True
	}
	MODULE
	{
		name = Sickbay
		resource = _QuartersModern
		title = Modern Quarters
		desc = Our astronauts have access to ventilated, sound-proof private crew quarters, proper exercise equipment and modern computers. This relieves 47% of the normal stress build-up. <b>Start it in flight, and again after crew changes or EVAs.</b>
		capacity = #$/CrewCapacity$
		slots = 1
		cureEverybody = True
	}
	MODULE
	{
		name = Sickbay
		resource = _QuartersNF
		title = Near Future Quarters
		desc = Our astronauts can retreat into generously sized private quarters, decorated to their liking and enjoy cutting edge entertainment systems. This relieves 67% of the normal stress build-up. <b>Start it in flight, and again after crew changes or EVAs.</b>
		capacity = #$/CrewCapacity$
		slots = 1
		cureEverybody = True
	}

	MODULE
	{
		name = Configure
		title = Crew Facilities
		slots = 1
		reconfigure = false

		SETUP
		{
			name = None
			desc = No crew facilities installed.
		}
		// Mass and cost are per crew seat: set to CrewCapacity here, multiplied by the per-seat value in the patch below.
		SETUP
		{
			name = Spartan Quarters
			desc = Our astronauts can call family and friends and get some much desired private time. Relieves 2% of the normal stress build-up. Best case about 4.0 years before breakdown (the planner ignores cures).
			mass = #$/CrewCapacity$
			cost = #$/CrewCapacity$
			MODULE
			{
				type = Sickbay
				id_field = resource
				id_value = _QuartersBasic
			}
		}
		SETUP
		{
			name = Expanded Quarters
			desc = More room to retreat for rest, some exercise equipment, a TV set and some instruments. Relieves 27% of the normal stress build-up. Best case about 5.4 years before breakdown (the planner ignores cures).
			tech = modularSpaceStations
			mass = #$/CrewCapacity$
			cost = #$/CrewCapacity$
			MODULE
			{
				type = Sickbay
				id_field = resource
				id_value = _QuartersExpanded
			}
		}
		SETUP
		{
			name = Modern Quarters
			desc = Ventilated, sound-proof private crew quarters, proper exercise equipment and modern computers. Relieves 47% of the normal stress build-up. Best case about 7.5 years before breakdown (the planner ignores cures).
			tech = largeScaleOrbitalCon
			mass = #$/CrewCapacity$
			cost = #$/CrewCapacity$
			MODULE
			{
				type = Sickbay
				id_field = resource
				id_value = _QuartersModern
			}
		}
		SETUP
		{
			name = Near Future Quarters
			desc = Generously sized private quarters, decorated to the crew's liking, with cutting edge entertainment. Relieves 67% of the normal stress build-up. Best case about 12 years before breakdown (the planner ignores cures).
			tech = inflatableHabitats
			mass = #$/CrewCapacity$
			cost = #$/CrewCapacity$
			MODULE
			{
				type = Sickbay
				id_field = resource
				id_value = _QuartersNF
			}
		}
	}
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#title[Crew?Facilities]]]:NEEDS[ProfileRealismOverhaul,FeatureComfort]:FINAL
{
	@MODULE[Configure]:HAS[#title[Crew?Facilities]]
	{
		@SETUP[Spartan?Quarters]
		{
			@mass *= 0.04 // Sleeping bags & comms terminal
			@cost *= 80
		}
		@SETUP[Expanded?Quarters]
		{
			@mass *= 0.6 // TV, exercise equipment, room dividers, etc.
			@cost *= 1200
		}
		@SETUP[Modern?Quarters]
		{
			@mass *= 1.0 // Larger cabins, entertainment & exercise
			@cost *= 1600
		}
		@SETUP[Near?Future?Quarters]
		{
			@mass *= 0.8 // Near Future, so things are lighter
			@cost *= 2000
		}
	}
}


@PART[*]:HAS[@MODULE[Sickbay]:HAS[#resource[_SickbayColony]]]:NEEDS[ProfileRealismOverhaul,FeatureComfort]:FINAL
{
	MODULE
	{
		name = Configure
		title = Rest Facility
		slots = 1
		reconfigure = false

		SETUP
		{
			name = None
			desc = No rest facility installed.
		}
		SETUP
		{
			name = Rest Facility
			desc = Landed only. Recover from microgravity with proper showers, laundry and a gym. Relieves 30% of the normal stress build-up. With Near Future Quarters and exercise equipment, stress stops building up but does not decrease.
			tech = improvedHabitats
			mass = #$/CrewCapacity$
			cost = #$/CrewCapacity$
			MODULE
			{
				type = Sickbay
				id_field = resource
				id_value = _SickbayColony
			}
		}
	}
}

@PART[*]:HAS[@MODULE[Configure]:HAS[#title[Rest?Facility]]]:NEEDS[ProfileRealismOverhaul,FeatureComfort]:FINAL
{
	@MODULE[Configure]:HAS[#title[Rest?Facility]]
	{
		@SETUP[Rest?Facility]
		{
			@mass *= 0.5 // Gravity simplifies things again
			@cost *= 1000
		}
	}
}

// Add ooptional exercise equipment to the parts  that don't have it already but have a crew cap above 4

@PART[*]:HAS[#crewFacilities[true],#CrewCapacity[>3],!MODULE[Comfort]:HAS[#bonus[exercise]]]:NEEDS[ProfileRealismOverhaul,FeatureComfort]:FINAL
{
	MODULE
	{
		name = Comfort
		bonus = exercise
		desc = Treadmill and ergometer, installed through the Exercise Equipment menu.
	}
	MODULE
	{
		name = Configure
		title = Exercise Equipment
		slots = 1
		reconfigure = false

		SETUP
		{
			name = None
			desc = No exercise equipment installed.
		}
		SETUP
		{
			name = Exercise Equipment
			desc = Treadmill and cycle ergometer as flown on Salyut and Skylab. Exercise comfort for the whole vessel, and relieves 3% of the normal stress build-up for the crew seated in this part. 0.15 t.
			tech = earlySpaceStations
			mass = 0.15 
			cost = 300
			MODULE
			{
				type = Comfort
				id_field = bonus
				id_value = exercise
			}
			MODULE
			{
				type = Sickbay
				id_field = resource
				id_value = _ComfortExercise
			}
		}
	}
	@tags ^= :$: comfort:
}
