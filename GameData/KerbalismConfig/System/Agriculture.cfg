// ============================================================================
// Add agriculture
// ============================================================================

@PART[kerbalism-greenhouse]:NEEDS[ProfileRealismOverhaul]:FOR[Kerbalism]
{
	%RSSROConfig = true
	MODULE
	{
		name = ProcessController
		resource = _PressureControl
		title = N2 Pressure Controller
		desc = Use <b>Nitrogen</b> to maintain the internal atmosphere at a comfortable pressure.
		capacity = 1.67
		toggle = true
		running = true
	}

	MODULE
	{
		name = ProcessController
		resource = _algae
		title = Algae Bioreactor
		desc = Produces <b>Food</b>, <b>Water</b> and <b>Oxygen</b> from <b>CarbonDioxide</b> and <b>WasteWater</b>.
		capacity = 20 // Based on SSPX
		toggle = true
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _Hydroponics
		title = Hydroponics
		capacity = 1 // 24 m^3 growing volume
		toggle = true
		running = true
	}

	MODULE
	{
		name = ProcessController
		resource = _NitrogenRecovery
		title = Nitrogen Recovery
		capacity = 1.5 // the urine of 1.5 crew: 1.5 * 9.56 = 14.3 g NH3/day, the Ammonia need of one greenhouse
		toggle = true
		running = true
	}

	MODULE
	{
		name = Comfort
		bonus = plants
		desc =  There's something inherently calming about an artificial slice of nature, kept alive only by the miracles of duct-tape and kerbal engineering. Let's hope the crew doesn't think too much about it.
	}

	@tags ^= :$: comfort:

	processConfigureExclude = true
	MODULE
	{
		name = Configure
		title = Greenhouse
		slots = 1

		SETUP
		{
			name = Algae Bioreactor
			desc = Algae in a photobioreactor recycle <b>CarbonDioxide</b> and <b>WasteWater</b> into <b>Oxygen</b>. <b>Food</b> is only a small by-product.
			tech = improvedLifeSupport
			mass = 0.3 // tanks and pumps
			cost = 100 // PLACEHOLDER

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _algae
			}
		}

		SETUP
		{
			name = Hydroponics
			desc = Crops grown in a nutrient solution under lamps produce <b>Food</b> and <b>Oxygen</b> from <b>Water</b>, <b>CarbonDioxide</b> and <b>Ammonia</b> (the nitrogen nutrient).
			tech = longTermLifeSupport
			mass = 0.6 // trays, pumps, etc.
			cost = 200 // PLACEHOLDER

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _Hydroponics
			}
			RESOURCE
			{
				name = Ammonia
				amount = 0
				maxAmount = 556 // 30 days of Ammonia input: 0.000214618 units/s * 86400 * 30
			}
		}
	}

	MODULE
	{
		name = Configure
		title = Nutrient Recovery
		slots = 1
		reconfigure = false

		SETUP
		{
			name = None
			desc = No nutrient recovery installed. <b>Ammonia</b> for the crops has to be brought along.
		}
		SETUP
		{
			name = Nitrogen Recovery
			desc = A urine bioreactor hydrolyses urea and strips the <b>Ammonia</b> for the crops, then distils the rest into <b>Water</b>. Takes the urine share of <b>WasteWater</b> of 1.5 crew, which covers the nitrogen need of one greenhouse.
			tech = commercialLifeSupport
			mass = 0.3 // Reactor
			cost = 100 // PLACEHOLDER

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _NitrogenRecovery
			}
		}
	}
}

