@PART[HL20_Body]:NEEDS[HL20_ConstructionKit,ProfileRealismOverhaul,Kerbalism]:AFTER[RealismOverhaul]
{
	%capsuleScrubbers = true
	%scrubberCapacity = 1.67
	%capsuleOrigin = US

	MODULE
	{
		name = ProcessController
		resource = _PressureControl
		title = N2 Pressure Controller
		desc = Use <b>Nitrogen</b> to maintain the internal atmosphere at a comfortable pressure.
		capacity = 1.67
		toggle = true
		running = true
	}

	MODULE
	{
		name = ProcessController
		resource = _AirPump
		title = Air Pump
		capacity = 1.2
		running = true
	}

	@MODULE[ProcessController],*
	{
		@capacity *= #$/CrewCapacity$
	}
}

@PART[HL20_Body]:NEEDS[HL20_ConstructionKit,ProfileRealismOverhaul,Kerbalism,RealFuels]:AFTER[RealismOverhaul]
{
	@MODULE[ModuleFuelTanks]
	{
		@volume += 50
		TANK
		{
			name = Nitrogen
			amount = 5000
			maxAmount = 5000
		}
	}
}

@PART[HL20_Body]:NEEDS[HL20_ConstructionKit,ProfileRealismOverhaul,FeatureHabitat]:AFTER[zzzKerbalism]
{
	@MODULE[Habitat]
	{
		%volume = 12
		%surface = 31
		%max_pressure = 1
	}
}
