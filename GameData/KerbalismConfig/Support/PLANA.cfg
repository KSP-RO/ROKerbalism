
@PART[PROXI-SC-body]:NEEDS[FeatureHabitat]:AFTER[zzzKerbalism]
{
    @MODULE[Habitat]
    {
        %volume = 40.0
        %surface = 60.0
    }

    MODULE
    {
        name = ProcessController
        resource = _Scrubber
        title = Scrubber
        capacity = 14.0
        running = true
    }

    MODULE
    {
        name = ProcessController
        resource = _PressureControlOxygen
        title = O2 Pressure Control
        capacity = 0.85 // (60 / 70)
        running = true
    }

    MODULE
    {
        name = ProcessController
        resource = _FuelCell
        title = Fuel Cell 1 
        capacity = 7.0
        running = true
    }

    MODULE
    {
        name = ProcessController
        resource = _FuelCell
        title = Fuel Cell 2 
        capacity = 7.0
        running = false
    }
}

@PART[PROXI-DCY-crewBay]:NEEDS[FeatureHabitat]:AFTER[zzzKerbalism]
{
    @MODULE[Habitat]
    {
        %volume = 25.0
        %surface = 40.0
    }

    MODULE
    {
        name = ProcessController
        resource = _Scrubber
        title = Scrubber
        capacity = 4.0
        running = true
    }

    MODULE
    {
        name = ProcessController
        resource = _PressureControlOxygen
        title = O2 Pressure Control
        capacity = 0.57 // (40 / 70)
        running = true
    }
}