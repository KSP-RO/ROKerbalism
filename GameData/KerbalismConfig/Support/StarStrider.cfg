@PART[BKI25_Pod]:NEEDS[StarStrider,RealFuels,ProfileRealismOverhaul]:AFTER[RealismOverhaul]
{
	@MODULE[ModuleCommand]
	{
		@RESOURCE[ElectricCharge]
		{
			@rate -= 0.304
		}
	}

	MODULE
	{
		name = ProcessController
		resource = _Scrubber
		title = LiOH Scrubber
		capacity = 4
		toggle = true
		running = true
	}

	MODULE
	{
		name = ProcessController
		resource = _PressureControlOxygen
		title = O2 Pressure Controller
		capacity = 4
		toggle = true
		running = true
	}

	processConfigureExclude = true
	MODULE
	{
		name = Configure
		title = Life Support
		slots = 2

		SETUP
		{
			name = LiOH Scrubber
			desc = A Lithium Hydroxide scrubber that sequesters <b>CarbonDioxide</b> from the internal atmosphere. Its operational life can be increased by adding additional LiOH.
			tech = earlyLifeSupport

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _Scrubber
			}
		}

		SETUP
		{
			name = O2 Pressure Controller
			desc = Use <b>Oxygen</b> to maintain the internal atmosphere at a comfortable pressure.
			tech = crewSurvivability

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _PressureControlOxygen
			}
		}
	}
}

@PART[BKI25_Pod]:NEEDS[StarStrider,RealFuels,ProfileRealismOverhaul,FeatureHabitat]:AFTER[RealismOverhaul]
{
	%MODULE[Habitat]
	{
		%volume = 6.5
		%surface = 17.0
		%max_pressure = 0.35
	}
}

@PART[BKI25_SM]:NEEDS[StarStrider,RealFuels,ProfileRealismOverhaul]:AFTER[RealismOverhaul]
{
	@description ^= :$: Fuel cells, LOX converter and O2 pressure controller can be configured.:

	MODULE
	{
		name = ProcessController
		resource = _FuelCell
		title = Fuel Cells
		capacity = 4.2
		toggle = true
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _LOXConverter
		title = LOX to GOX Converter
		capacity = 4
		toggle = true
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _PressureControlOxygen
		title = O2 Pressure Controller
		capacity = 4
		toggle = true
		running = true
	}

	processConfigureExclude = true
	MODULE
	{
		name = Configure
		title = Processes
		slots = 3

		SETUP
		{
			name = O2 Pressure Controller
			desc = Use <b>Oxygen</b> to maintain the internal atmosphere at a comfortable pressure.
			tech = crewSurvivability

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _PressureControlOxygen
			}
		}

		SETUP
		{
			name = Fuel Cells
			desc = 4.2 kW fuel cell unit that consumes <b>LqdHydrogen</b> and <b>LqdOxygen</b> to generate <b>Water</b>.
			tech = lunarRatedPower

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _FuelCell
			}
		}

		SETUP
		{
			name = LOX to GOX Converter
			desc = Heats <b>LqdOxygen</b> to breathable <b>Oxygen</b>.
			tech = earlyLifeSupport

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _LOXConverter
			}
		}
	}
}
