
RESOURCE_DEFINITION:NEEDS[NearFutureElectrical]
{
	name = _NuclearReprocessing
	density = 0.0
	isVisible = false
}

RESOURCE_DEFINITION:NEEDS[NearFutureElectrical]
{
	name = _RegolithUraniumExtraction
	density = 0.0
	isVisible = false
}

Profile
{
	name = KerbalismSupport
	modname = Near Future Electrical
	moddir = NearFutureElectrical

	Supply
	{
		resource = DepletedFuel
		low_message = Depleted Fuel storage is almost full on $VESSEL@<i>Nuclear Reprocessing capacity may be halted</i>
		empty_message = Depleted Fuel storage is full on $VESSEL@<i>Nuclear Reprocessing has halted</i>
		refill_message = $VESSEL Depleted Fuel storage cleared@<i>Nuclear Reprocessing resumed</i>
	}

	Supply
	{
		resource = EnrichedUranium
		low_message = Enriched Uranium is almost depleted on $VESSEL@<i>Nuclear Reactors will shut down soon</i>
		empty_message = There is no more Enriched Uranium on $VESSEL@<i>Nuclear Reactors have shut down</i>
		refill_message = $VESSEL Enriched Uranium storage refilled@<i>Nuclear Reactors back online</i>
	}

	Process
	{
		name = nuclear reprocessing
		modifier = _NuclearReprocessing
		input = ElectricCharge@50.0
		input = DepletedFuel@0.00000218
		output = EnrichedUranium@0.00000109
		output = DepletedFuel@0.00000109
		dump_valve = DepletedFuel
	}

	Process
	{
		name = regolith uranium extraction
		modifier = _RegolithUraniumExtraction
		input = ElectricCharge@120.0
		input = Regolith@0.005
		output = EnrichedUranium@0.0000005
		dump_valve = EnrichedUranium
	}
}

@PART[nfe-nuclear-recycler-25-1]:NEEDS[NearFutureElectrical,Kerbalism]:AFTER[NearFutureElectrical]
{
	
	!MODULE[ModuleSystemHeatConverter],* {}

	MODULE:NEEDS[FeatureRadiation]
	{
		name = Emitter
		radiation = 0.000003 // rad/s
	}

	MODULE
	{
		name = ProcessController
		resource = _NuclearReprocessing
		title = Spent Fuel Reprocessing
		capacity = 110
		running = true
	}

	MODULE
	{
		name = ProcessController
		resource = _RegolithUraniumExtraction
		title = Regolith Uranium Extraction
		capacity = 110
		running = true
	}

	processConfigureExclude = true
	MODULE
	{
		name = Configure
		title = Nuclear Processor
		slots = 1

		SETUP
		{
			name = None
			desc = Empty slot for mass and cost savings, should you not require reprocessing active.
		}

		SETUP
		{
			name = Spent Fuel Reprocessing
			desc = Extracts re-enrichable fissile isotopes from <b>DepletedFuel</b> to produce usable <b>EnrichedUranium</b>, discarding leftover mass as <b>DepletedFuel</b>.
			tech = advModernNuclearPower
			mass = 0.5
			cost = 1500

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _NuclearReprocessing
			}
			RESOURCE
			{
				name = DepletedFuel
				amount = 0
				maxAmount = 50
			}
			RESOURCE
			{
				name = EnrichedUranium
				amount = 0
				maxAmount = 50
			}
		}

		SETUP
		{
			name = Regolith Uranium Extraction
			desc = Chemical leaching and isotopic enrichment of ore-bearing <b>Regolith</b> into reactor-grade <b>EnrichedUranium</b>.
			tech = advModernNuclearPower
			mass = 1.2
			cost = 3500

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _RegolithUraniumExtraction
			}
			RESOURCE
			{
				name = Regolith
				amount = 0
				maxAmount = 250
			}
			RESOURCE
			{
				name = EnrichedUranium
				amount = 0
				maxAmount = 50
			}
		}
	}

	MODULE:NEEDS[FeatureReliability]
	{
		name = Reliability
		type = ProcessController
		title = Nuclear Processor
		redundancy = Power Generation
		repair = Engineer
		mtbf = 36288000
		extra_cost = 2.5
		extra_mass = 1.0
	}
}