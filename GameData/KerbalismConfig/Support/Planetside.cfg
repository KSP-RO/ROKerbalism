//  =================================================================
//  PLANETSIDE SPACE TECHNOLOGIES (MMSEV) - ROKERBALISM
//  =================================================================

// -----------------------------------------------------------------
// COMMAND & LANDER CABINS
// -----------------------------------------------------------------

@PART[Benjee10_MMSEV]:NEEDS[ProfileRealismOverhaul,FeatureHabitat]:AFTER[RealismOverhaul]
{
    %capsuleScrubbers = true
    %scrubberCapacity = 1.67
    
    MODULE
    {
        name = ProcessController
        resource = _PressureControl
        title = N2 Pressure Controller
        desc = Use <b>Nitrogen</b> to maintain the internal atmosphere at a comfortable pressure.
        capacity = 1.67
        toggle = true
        running = true
    }
    
    @MODULE[ProcessController],*
    {
        @capacity *= #$/CrewCapacity$
    }
    
    %MODULE[Habitat]
    {   
        %volume = 10.0
        %surface = 25.0
    }

    @MODULE[ModuleFuelTanks]
    {
        TANK
        {
            name = Food
            amount = 117
            maxAmount = 117
        }
        TANK
        {
            name = Water
            amount = 77
            maxAmount = 77
        }
        TANK
        {
            name = Oxygen
            amount = 12000
            maxAmount = 12000
        }
        TANK
        {
            name = WasteWater
            amount = 0
            maxAmount = 100
        }
        TANK
        {
            name = Waste
            amount = 0
            maxAmount = 10
        }
        TANK
        {
            name = Nitrogen
            amount = 500
            maxAmount = 500
        }
    }
}

