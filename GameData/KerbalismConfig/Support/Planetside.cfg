    {
        name = ProcessController
        resource = _WaterRecycler
        title = Water Recycler
        desc = Filters impurities out of <b>WasteWater</b>.
        capacity = 1.67
        toggle = true
        running = true
    }
    
    @MODULE[ProcessController],*
    {
        @capacity *= #$/CrewCapacity$
    }
    
    %MODULE[Habitat]
    {   
        %volume = 120.0
        %surface = 130.0
