// Vostok 3KA
@PART[andromeda_crew_s1_1]:NEEDS[Tantares,RealFuels,ProfileRealismOverhaul,FeatureHabitat]:AFTER[RealismOverhaul]
{
	@description ^= :$: Supports a crew of one for 10 days.:

	%MODULE[Habitat]
	{
		%volume = 1.5
		%surface = 16.6
	}
	%capsuleScrubbers = true
	%scrubberCapacity = 1.2
	%capsuleOrigin = USSR

	MODULE
	{
		name = ProcessController
		resource = _PressureControl
		title = N2 Pressure Controller
		desc = Use <b>Nitrogen</b> to maintain the internal atmosphere at a comfortable pressure.
		capacity = 1
		toggle = true
		running = true
	}

	@MODULE[ModuleFuelTanks]
	{
		@volume += 7.3
		@TANK[PotassiumSuperoxide]
		{
			@amount = 11.6
			@maxAmount = 11.6
		}
		TANK
		{
			name = Nitrogen
			amount = 73
			maxAmount = 73
		}
	}
}

