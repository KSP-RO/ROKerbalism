@PART[ro_Zvezda_crew_s2_1]:NEEDS[Tantares,RealFuels,ProfileRealismOverhaul,FeatureHabitat]:AFTER[RealismOverhaul]
{
	%MODULE[Habitat]
	{
		%volume = 45.21
		%surface = 49.8
	}

	MODULE:NEEDS[FeatureComfort]
	{
		name = Comfort
		bonus = exercise
		desc = A treadmill designed to permit exercise in zero-g is included. The crew will love it.
	}

	MODULE:NEEDS[FeatureReliability]
	{
		name = Reliability
		type = Comfort
		title = Treadmill
		repair = Engineer
		mtbf = 36288000
		extra_cost = 0.25
		extra_mass = 0.05
	}
	@tags ^= :$: comfort:

	MODULE
	{
		name = ProcessController
		resource = _WaterElectrolysis
		title = Water Electrolysis
		capacity = 3
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _VacScrubber
		title = Vacuum Scrubber
		capacity = 3
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _PressureControl
		title = N2 Pressure Control
		capacity = 3
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _PressureControlOxygen
		title = O2 Pressure Control
		capacity = 3
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _BasicWaterRecycler
		title = Basic Water Recycler
		capacity = 3
		running = true
	}

	processConfigureExclude = true
	MODULE
	{
		name = Configure
		title = Life Support
		slots = 4

		SETUP
		{
			name = None
			desc = Empty slot for mass and cost savings.
		}

		SETUP
		{
			name = Water Electrolysis
			desc = Split <b>Water</b> into its <b>Hydrogen</b> and <b>Oxygen</b> components.
			tech = longTermLifeSupport

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _WaterElectrolysis
			}
		}

		SETUP
		{
			name = Vacuum Scrubber
			desc = A dual-bed vacuum-exposing regenerative scrubber that sequesters <b>CarbonDioxide</b> from the internal atmosphere.
			tech = basicLifeSupport

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _VacScrubber
			}
		}

		SETUP
		{
			name = N2 Pressure Control
			desc = Use <b>Nitrogen</b> to maintain the internal atmosphere at a comfortable pressure.
			tech = earlyLifeSupport

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _PressureControl
			}
		}

		SETUP
		{
			name = O2 Pressure Control
			desc = Use <b>Oxygen</b> to maintain the internal atmosphere at a comfortable pressure.
			tech = earlyLifeSupport

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _PressureControlOxygen
			}
		}

		SETUP
		{
			name = Basic Water Recycler
			desc = Recovers part of the <b>WasteWater</b> as <b>Water</b>.
			tech = basicLifeSupport

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _BasicWaterRecycler
			}
		}
	}

	@MODULE[ModuleFuelTanks]
	{
		@volume += 76.1
		TANK
		{
			name = Nitrogen
			amount = 1750
			maxAmount = 1750
		}
	}
}

