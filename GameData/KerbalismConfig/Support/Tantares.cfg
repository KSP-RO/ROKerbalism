@PART[tucana_crew_s2_1]:NEEDS[Tantares,RealFuels,ProfileRealismOverhaul,FeatureHabitat]:AFTER[RealismOverhaul]
{
	%MODULE[Habitat]
	{
		%volume = 60.8
		%surface = 96.2
	}

	MODULE:NEEDS[FeatureComfort]
	{
		name = Comfort
		bonus = exercise
		desc = A treadmill designed to permit exercise in zero-g is included. The crew will love it.
	}

	MODULE:NEEDS[FeatureReliability]
	{
		name = Reliability
		type = Comfort
		title = Treadmill
		repair = Engineer
		mtbf = 36288000
		extra_cost = 0.25
		extra_mass = 0.05
	}
	@tags ^= :$: comfort:

	MODULE
	{
		name = ProcessController
		resource = _Scrubber
		title = LiOH Scrubber
		capacity = 3
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _PressureControl
		title = N2 Pressure Control
		capacity = 3
		running = true
	}

	processConfigureExclude = true
	MODULE
	{
		name = Configure
		title = Life Support
		slots = 2

		SETUP
		{
			name = None
			desc = Empty slot for mass and cost savings.
		}

		SETUP
		{
			name = LiOH Scrubber
			desc = A Lithium Hydroxide scrubber that sequesters <b>CarbonDioxide</b> from the internal atmosphere.
			tech = earlyLifeSupport

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _Scrubber
			}
		}

		SETUP
		{
			name = N2 Pressure Control
			desc = Use <b>Nitrogen</b> to maintain the internal atmosphere at a comfortable pressure.
			tech = earlyLifeSupport

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _PressureControl
			}
		}
	}

	@MODULE[ModuleFuelTanks]
	{
		@volume += 113.0
		TANK
		{
			name = Nitrogen
			amount = 2600
			maxAmount = 2600
		}
	}
}

