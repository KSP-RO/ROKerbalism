@PART[alnair_v2_crew_s2_1]:NEEDS[Tantares,RealFuels,ProfileRealismOverhaul,FeatureHabitat]:AFTER[RealismOverhaul]
{
	@description ^= :$: Supports three crew for up to 31 hours of independent flight.:

	%MODULE[Habitat]
	{
		%volume = 6.0
		%surface = 15.5
	}
	%capsuleScrubbers = true
	%scrubberCapacity = 1.2
	%capsuleOrigin = USSR

	MODULE
	{
		name = ProcessController
		resource = _PressureControl
		title = N2 Pressure Controller
		desc = Use <b>Nitrogen</b> to maintain the internal atmosphere at a comfortable pressure.
		capacity = 1
		toggle = true
		running = true
	}

	@MODULE[ModuleFuelTanks]
	{
		@volume += 5.0
		@TANK[Food]
		{
			@amount = 22.7
			@maxAmount = 22.7
		}
		@TANK[Water]
		{
			@amount = 15.0
			@maxAmount = 15.0
		}
		@TANK[Waste]
		{
			@maxAmount = 22.7
		}
		@TANK[WasteWater]
		{
			@maxAmount = 15.0
		}
		TANK
		{
			name = PotassiumSuperoxide
			amount = 4.5
			maxAmount = 4.5
		}
		TANK
		{
			name = Nitrogen
			amount = 12
			maxAmount = 12
		}
	}
}

