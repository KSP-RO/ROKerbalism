Profile:NEEDS[RealismOverhaul,Kerbalism,Sandcastle]
{
	name = KerbalismSupport
	modname = Sandcastle
	moddir = WildBlueIndustries/Sandcastle

	// --- Supply Notifications ---
	Supply
	{
		resource = Regolith
		low_message = Regolith is almost depleted on $VESSEL@<i>Smelting operations will soon halt</i>
		empty_message = There is no more Regolith on $VESSEL@<i>Smelting operations have halted</i>
		refill_message = $VESSEL Regolith storage refilled@<i>Smelting operations ready</i>
	}

	Supply
	{
		resource = Ceramics
		low_message = Ceramics are almost depleted on $VESSEL@<i>Structural and thermal printing will soon halt</i>
		empty_message = There are no more Ceramics on $VESSEL@<i>Structural and thermal printing has halted</i>
		refill_message = $VESSEL Ceramics storage refilled@<i>Printing operations ready</i>
	}

	Supply
	{
		resource = Metal
		low_message = Metal is almost depleted on $VESSEL@<i>Printing and vessel assembly will soon halt</i>
		empty_message = There is no more Metal on $VESSEL@<i>Printing and vessel assembly have halted</i>
		refill_message = $VESSEL Metal storage refilled@<i>Printing operations ready</i>
	}

	Supply
	{
		resource = RareMetals
		low_message = Rare Metals are almost depleted on $VESSEL@<i>Printing and vessel assembly will soon halt</i>
		empty_message = There are no more Rare Metals on $VESSEL@<i>Printing and vessel assembly have halted</i>
		refill_message = $VESSEL Rare Metals storage refilled@<i>Printing operations ready</i>
	}

	Supply
	{
		resource = Silicon
		low_message = Silicon is almost depleted on $VESSEL@<i>Electronics and science printing will soon halt</i>
		empty_message = There is no more Silicon on $VESSEL@<i>Electronics and science printing has halted</i>
		refill_message = $VESSEL Silicon storage refilled@<i>Printing operations ready</i>
	}

	Supply
	{
		resource = Aluminium
		low_message = Aluminium is almost depleted on $VESSEL@<i>Printing and vessel assembly will soon halt</i>
		empty_message = There is no more Aluminium on $VESSEL@<i>Printing and vessel assembly have halted</i>
		refill_message = $VESSEL Aluminium storage refilled@<i>Printing operations ready</i>
	}

	Supply
	{
		resource = Polymers
		low_message = Polymers are almost depleted on $VESSEL@<i>Printing and vessel assembly will soon halt</i>
		empty_message = There are no more Polymers on $VESSEL@<i>Printing and vessel assembly have halted</i>
		refill_message = $VESSEL Polymers storage refilled@<i>Printing operations ready</i>
	}

	Supply
	{
		resource = Lead
		low_message = Lead is almost depleted on $VESSEL@<i>Crew pod printing will soon halt</i>
		empty_message = There is no more Lead on $VESSEL@<i>Crew pod printing has halted</i>
		refill_message = $VESSEL Lead storage refilled@<i>Printing operations ready</i>
	}

	// --- Smelting, Refining & Synthesis Processes ---

	// Carbothermal reduction of FeO in regolith (~9-12% FeO by mass in
	// mare-ish regolith Fe is ~78% of FeO by mass -> ~8-9% Fe yield).
	// Methane loop as in NASA/Orbitec carbothermal ISRU: CH4 reduces the melt
	// to CO + H2, a methanation step turns that back into CH4 + H2O, and the
	// water is electrolysed. Net result: Regolith -> Fe + O2, with ~2% of the
	// circulating methane lost and needing make-up.
	//   Fe 0.0020 u x 7.8 kg = 15.6 g/s = 0.279 mol/s
	//   O2 released = 0.140 mol/s = 3.13 L/s
	//   CH4 circulating 0.279 mol/s, 2% make-up = 0.00558 mol/s = 0.0895 g/s
	//   fed as LqdMethane (0.42561 kg/L): 0.000210 L/s. RealFuels tanks cannot
	//   hold gaseous Methane, so the make-up comes from cryo tanks.
	// Power raised to cover the water electrolysis step (~286 kJ/mol O),
	// ~9.6 MJ/kg Fe overall.
	Process
	{
		name = carbothermal metal smelter
		modifier = _MetalSmelter
		input = ElectricCharge@150.0
		input = Regolith@0.115
		input = LqdMethane@0.000210
		output = Metal@0.0020
		output = Oxygen@3.13
		dump_valve = Oxygen
	}

	// Trace REE/PGM molten-salt electrolysis. Regolith input increased 4x vs.
	// the original to bring implied ore grade down from ~0.5% to ~0.12%
	// (still generous vs. real ~0.01-0.05%, but no longer "REE ore deposit"
	// grade). Energy cost reflects the heavy beneficiation + separation
	// chemistry real REE refining requires (~38 MJ/kg here vs. real-world
	// figures that can run well past 50-100 MJ/kg once mining/crushing is
	// included).
	Process
	{
		name = molten salt rare metals smelter
		modifier = _RareMetalsSmelter
		input = ElectricCharge@300.0
		input = Regolith@4.000
		output = RareMetals@0.001
	}

	// SiO2 is ~45% of regolith by mass; elemental Si is ~47% of SiO2 by mass,
	// so max theoretical yield is ~21%. This runs at ~13% (roughly 60%
	// extraction efficiency), which is a believable real-process efficiency.
	// Energy raised substantially (still below the ~40 MJ/kg industrial
	// carbothermic figure, since that would make silicon production
	// essentially non-viable at game power scales).
	// Same methane carbothermal loop as the metal smelter, run hotter for
	// SiO2 + 2C -> Si + 2CO; the oxygen comes out as O2 after electrolysis.
	//   Si 0.019 u x 2.33 kg = 44.3 g/s = 1.58 mol/s
	//   O2 released = 1.58 mol/s = 35.4 L/s
	//   CH4 circulating 3.16 mol/s, 2% make-up = 0.0634 mol/s = 1.017 g/s
	//   fed as LqdMethane (0.42561 kg/L): 0.00239 L/s
	Process
	{
		name = silicate reduction silicon smelter
		modifier = _SiliconSmelter
		input = ElectricCharge@230.0
		input = Regolith@0.210
		input = LqdMethane@0.00239
		output = Silicon@0.019
		output = Oxygen@35.4
		dump_valve = Oxygen
	}

	// Al2O3 is ~15-25% of regolith by mass; elemental Al is ~53% of Al2O3 by
	// mass, so max theoretical yield is ~8-13%. Running at ~12% assumes
	// aluminium-rich (highlands-adjacent) feedstock. Energy raised ~5x; still
	// well below real Hall-Heroult intensity (~50 MJ/kg).
	// Inert-anode molten oxide electrolysis: no carbon anode is burned, so
	// the oxygen leaves as O2 instead of CO2.
	//   Al 0.011 u x 2.7 kg = 29.7 g/s = 1.10 mol/s
	//   2 Al2O3 -> 4 Al + 3 O2: O2 = 0.825 mol/s = 18.5 L/s
	Process
	{
		name = alumina electrolysis aluminium smelter
		modifier = _AluminiumSmelter
		input = ElectricCharge@230.0
		input = Regolith@0.150
		output = Aluminium@0.011
		output = Oxygen@18.5
		dump_valve = Oxygen
	}

	// Reverse water-gas shift + Fischer-Tropsch to polyethylene-type (CH2)n:
	//   n CO2 + 3n H2 -> (CH2)n + 2n H2O
	//   Polymers 0.0005 u x 1 kg = 0.5 g/s = 0.0357 mol/s CH2
	//   CO2 = 0.0357 mol/s = 0.80 L/s, H2 = 0.107 mol/s = 2.40 L/s
	//   H2O = 0.0714 mol/s = 1.29 g/s
	Process
	{
		name = fischer-tropsch polymer synthesis
		modifier = _PolymerSynthesis
		input = ElectricCharge@50.0
		input = CarbonDioxide@0.80
		input = Hydrogen@2.40
		output = Polymers@0.0005
		output = Water@0.00129
	}

	// Sintering drives the solar-wind and bound volatiles out of the regolith.
	// ~3% of the feed mass is lost; most of it is water, recovered here.
	//   Regolith 0.150 u x 1.6 kg = 240 g/s
	//   Ceramics 0.080 u x 2.9 kg = 232 g/s, Water 0.004 u = 4 g/s
	Process
	{
		name = regolith microwave sintering
		modifier = _CeramicsSinter
		input = ElectricCharge@700.0
		input = Regolith@0.150
		output = Ceramics@0.080
		output = Water@0.004
		dump_valve = Water
	}
	
	Process
	{
		name = electronics-grade lead recovery
		modifier = _LeadSmelter
		input = ElectricCharge@120.0
		input = Regolith@0.800
		output = Lead@0.0005
	}
}

