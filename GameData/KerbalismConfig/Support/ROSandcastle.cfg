@PART[kerbalism-miniISRU]:NEEDS[RealismOverhaul,Kerbalism,Sandcastle]:AFTER[Kerbalism]
{
	MODULE
	{
		name = ProcessController
		resource = _MetalSmelter
		title = Regolith Smelter (Metal)
		capacity = 0.5
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _RareMetalsSmelter
		title = Trace Refining (Rare Metals)
		capacity = 0.5
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _SiliconSmelter
		title = Silicate Reduction (Silicon)
		capacity = 0.5
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _AluminiumSmelter
		title = Alumina Electrolysis (Aluminium)
		capacity = 0.5
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _PolymerSynthesis
		title = Fischer-Tropsch Synthesis (Polymers)
		capacity = 0.5
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _CeramicsSinter
		title = Regolith Sintering (Ceramics)
		capacity = 0.5
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _LeadSmelter
		title = Electronics-Grade Lead Recovery
		capacity = 0.5
		running = true
	}

	@MODULE[Configure]:HAS[#title[Mini?ISRU]]
	{
		SETUP
		{
			name = Regolith Smelter (Metal)
			desc = Carbothermal reduction of <b>Regolith</b> into <b>Metal</b> using a recycled methane loop. Needs a small <b>LqdMethane</b> make-up feed and releases <b>Oxygen</b>.
			tech = lifeSupportNF
			mass = 0.2
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _MetalSmelter
			}
		}
		SETUP
		{
			name = Trace Refining (Rare Metals)
			desc = Extract trace <b>RareMetals</b> from bulk <b>Regolith</b> using molten salt processing. Low yield by design — real regolith REE/PGM content is low parts-per-million.
			tech = lifeSupportNF
			mass = 0.25
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _RareMetalsSmelter
			}
		}
		SETUP
		{
			name = Silicate Reduction (Silicon)
			desc = Carbothermal reduction of silicate <b>Regolith</b> into <b>Silicon</b>. Needs a <b>LqdMethane</b> make-up feed and releases <b>Oxygen</b>.
			tech = lifeSupportNF
			mass = 0.2
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _SiliconSmelter
			}
		}
		SETUP
		{
			name = Alumina Electrolysis (Aluminium)
			desc = Inert-anode electrolysis of alumina-rich <b>Regolith</b> into <b>Aluminium</b>, releasing <b>Oxygen</b>.
			tech = lifeSupportNF
			mass = 0.2
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _AluminiumSmelter
			}
		}
		SETUP
		{
			name = Fischer-Tropsch Synthesis (Polymers)
			desc = Synthesize <b>Polymers</b> from <b>CO2</b> and <b>Hydrogen</b>, with <b>Water</b> as a byproduct. Regolith has no native carbon, so Polymers are no longer smelted directly from it.
			tech = lifeSupportNF
			mass = 0.2
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _PolymerSynthesis
			}
		}
		SETUP
		{
			name = Regolith Sintering (Ceramics)
			desc = Microwave/solar-furnace sinter loose <b>Regolith</b> into rigid <b>Ceramics</b> for structural and shielding use — no chemical reduction required, but still needs real heating energy. Driven-off volatiles are recovered as <b>Water</b>.
			tech = lifeSupportNF
			mass = 0.2
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _CeramicsSinter
			}
		}
		SETUP
		{
			name = Electronics-Grade Lead Recovery
			desc = Recover trace <b>Lead</b> from <b>Regolith</b> for solder and point-shielding use. Not intended as a bulk radiation-shielding source — use <b>Polymers</b> or <b>Ceramics</b> mass for that.
			tech = lifeSupportNF
			mass = 0.2
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _LeadSmelter
			}
		}
	}
}
