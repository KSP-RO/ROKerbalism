@PART[kerbalism-miniISRU]:NEEDS[RealismOverhaul,Kerbalism,Sandcastle]:AFTER[Kerbalism]
{
	MODULE
	{
		name = ProcessController
		resource = _MetalSmelter
		title = Regolith Smelter (Metal)
		capacity = 0.5
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _RareMetalsSmelter
		title = Trace Refining (Rare Metals)
		capacity = 0.5
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _SiliconSmelter
		title = Silicate Reduction (Silicon)
		capacity = 0.5
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _AluminiumSmelter
		title = Alumina Electrolysis (Aluminium)
		capacity = 0.5
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _PolymerPyrolysis
		title = Regolith Pyrolysis (Polymers)
		capacity = 0.5
		running = true
	}
	MODULE
	{
		name = ProcessController
		resource = _LeadSmelter
		title = Heavy Metal Smelting (Lead)
		capacity = 0.5
		running = true
	}

	@MODULE[Configure]:HAS[#title[Mini?ISRU]]
	{
		SETUP
		{
			name = Regolith Smelter (Metal)
			desc = Carbothermal reduction of <b>Regolith</b> into <b>Metal</b>.
			tech = lifeSupportNF
			mass = 0.2
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _MetalSmelter
			}
		}
		SETUP
		{
			name = Trace Refining (Rare Metals)
			desc = Extract trace <b>RareMetals</b> from bulk <b>Regolith</b> using molten salt processing.
			tech = lifeSupportNF
			mass = 0.25
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _RareMetalsSmelter
			}
		}
		SETUP
		{
			name = Silicate Reduction (Silicon)
			desc = Process silicate <b>Regolith</b> to yield refined <b>Silicon</b>.
			tech = lifeSupportNF
			mass = 0.2
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _SiliconSmelter
			}
		}
		SETUP
		{
			name = Alumina Electrolysis (Aluminium)
			desc = Electrolytic extraction of <b>Aluminium</b> from alumina-rich <b>Regolith</b>.
			tech = lifeSupportNF
			mass = 0.2
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _AluminiumSmelter
			}
		}
		SETUP
		{
			name = Regolith Pyrolysis (Polymers)
			desc = Pyrolyze volatile <b>Regolith</b> with <b>Water</b> to generate <b>Polymers</b> and byproduct <b>Oxygen</b>.
			tech = lifeSupportNF
			mass = 0.2
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _PolymerPyrolysis
			}
		}
		SETUP
		{
			name = Heavy Metal Smelting (Lead)
			desc = Extract heavy metal <b>Lead</b> from <b>Regolith</b>.
			tech = lifeSupportNF
			mass = 0.2
			cost = 50

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _LeadSmelter
			}
		}
	}
}
