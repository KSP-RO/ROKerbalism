Profile:NEEDS[RealismOverhaul,Kerbalism,Sandcastle]
{
	name = KerbalismSupport
	modname = Sandcastle
	moddir = WildBlueIndustries/Sandcastle

	// --- Supply Notifications ---
	Supply
	{
		resource = Regolith
		low_message = Regolith is almost depleted on $VESSEL@<i>Smelting operations will soon halt</i>
		empty_message = There is no more Regolith on $VESSEL@<i>Smelting operations have halted</i>
		refill_message = $VESSEL Regolith storage refilled@<i>Smelting operations ready</i>
	}

	Supply
	{
		resource = Ceramics
		low_message = Ceramics storage is almost full on $VESSEL
		empty_message = Ceramics storage is full on $VESSEL@<i>Regolith sintering halted</i>
		refill_message = $VESSEL Ceramics storage offloaded
	}

	Supply
	{
		resource = Metal
		low_message = Metal storage is almost full on $VESSEL
		empty_message = Metal storage is full on $VESSEL@<i>Smelting operations halted</i>
		refill_message = $VESSEL Metal storage offloaded
	}

	Supply
	{
		resource = RareMetals
		low_message = Rare Metals storage is almost full on $VESSEL
		empty_message = Rare Metals storage is full on $VESSEL@<i>Trace refining halted</i>
		refill_message = $VESSEL Rare Metals storage offloaded
	}

	Supply
	{
		resource = Silicon
		low_message = Silicon storage is almost full on $VESSEL
		empty_message = Silicon storage is full on $VESSEL@<i>Silicate reduction halted</i>
		refill_message = $VESSEL Silicon storage offloaded
	}

	Supply
	{
		resource = Aluminium
		low_message = Aluminium storage is almost full on $VESSEL
		empty_message = Aluminium storage is full on $VESSEL@<i>Alumina electrolysis halted</i>
		refill_message = $VESSEL Aluminium storage offloaded
	}

	Supply
	{
		resource = Polymers
		low_message = Polymers storage is almost full on $VESSEL
		empty_message = Polymers storage is full on $VESSEL@<i>Fischer-Tropsch synthesis halted</i>
		refill_message = $VESSEL Polymers storage offloaded
	}

	Supply
	{
		resource = Lead
		low_message = Lead storage is almost full on $VESSEL
		empty_message = Lead storage is full on $VESSEL@<i>Trace lead recovery halted</i>
		refill_message = $VESSEL Lead storage offloaded
	}

	// --- Smelting, Refining & Synthesis Processes ---

	// Carbothermal reduction of FeO in regolith (~9-12% FeO by mass in
	// mare-ish regolith Fe is ~78% of FeO by mass -> ~8-9% Fe yield).
	// ~4.2 MJ/kg product: plausible for combined carbothermal reduction + melt.
	Process
	{
		name = carbothermal metal smelter
		modifier = _MetalSmelter
		input = ElectricCharge@65.0
		input = Regolith@0.115
		output = Metal@0.0020
	}

	// Trace REE/PGM molten-salt electrolysis. Regolith input increased 4x vs.
	// the original to bring implied ore grade down from ~0.5% to ~0.12%
	// (still generous vs. real ~0.01-0.05%, but no longer "REE ore deposit"
	// grade). Energy cost reflects the heavy beneficiation + separation
	// chemistry real REE refining requires (~38 MJ/kg here vs. real-world
	// figures that can run well past 50-100 MJ/kg once mining/crushing is
	// included).
	Process
	{
		name = molten salt rare metals smelter
		modifier = _RareMetalsSmelter
		input = ElectricCharge@300.0
		input = Regolith@4.000
		output = RareMetals@0.001
	}

	// SiO2 is ~45% of regolith by mass; elemental Si is ~47% of SiO2 by mass,
	// so max theoretical yield is ~21%. This runs at ~13% (roughly 60%
	// extraction efficiency), which is a believable real-process efficiency.
	// Energy raised substantially (still below the ~40 MJ/kg industrial
	// carbothermic figure, since that would make silicon production
	// essentially non-viable at game power scales).
	Process
	{
		name = silicate reduction silicon smelter
		modifier = _SiliconSmelter
		input = ElectricCharge@230.0
		input = Regolith@0.210
		output = Silicon@0.019
	}

	// Al2O3 is ~15-25% of regolith by mass; elemental Al is ~53% of Al2O3 by
	// mass, so max theoretical yield is ~8-13%. Running at ~12% assumes
	// aluminium-rich (highlands-adjacent) feedstock. Energy raised ~5x; still
	// well below real Hall-Heroult intensity (~50 MJ/kg).
	Process
	{
		name = alumina electrolysis aluminium smelter
		modifier = _AluminiumSmelter
		input = ElectricCharge@230.0
		input = Regolith@0.150
		output = Aluminium@0.011
		output  Oxygen@0.80
		dump_valve = Oxygen
	}

	Process
	{
		name = fischer-tropsch polymer synthesis
		modifier = _PolymerSynthesis
		input = ElectricCharge@50.0
		input = CarbonDioxide@0.0020
		input = Hydrogen@0.0060
		output = Polymers@0.0005
		output = Water@0.0015
	}

	Process
	{
		name = regolith microwave sintering
		modifier = _CeramicsSinter
		input = ElectricCharge@700.0
		input = Regolith@0.150
		output = Ceramics@0.080
	}
	
	Process
	{
		name = electronics-grade lead recovery
		modifier = _LeadSmelter
		input = ElectricCharge@120.0
		input = Regolith@0.800
		output = Lead@0.0005
	}
}

