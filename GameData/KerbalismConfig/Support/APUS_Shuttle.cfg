@PART[APUScockpit1|APUScockpit2|APUScrew1|APUScrew2]:NEEDS[APUS_Shuttle,ProfileRealismOverhaul,RealFuels]:AFTER[RealismOverhaul]
{
	%capsuleScrubbers = true
	%scrubberCapacity = 1.67

	MODULE
	{
		name = ProcessController
		resource = _PressureControl
		title = N2 Pressure Controller
		desc = Use <b>Nitrogen</b> to maintain the internal atmosphere at a comfortable pressure.
		capacity = 1.67
		toggle = true
		running = true
	}

	@MODULE[ProcessController],*
	{
		@capacity *= #$/CrewCapacity$
	}

	@MODULE[ModuleFuelTanks]
	{
		@volume += 50
		TANK
		{
			name = Nitrogen
			amount = 5000
			maxAmount = 5000
		}
	}

	@description ^= :$: Supports its crew for 5 days.:
}

@PART[APUScockpit1]:NEEDS[APUS_Shuttle,ProfileRealismOverhaul]:AFTER[RealismOverhaul]
{
	@MODULE[ModuleCommand]
	{
		@RESOURCE[ElectricCharge]
		{
			@rate = 0.6
		}
	}
}

@PART[APUScockpit2]:NEEDS[APUS_Shuttle,ProfileRealismOverhaul]:AFTER[RealismOverhaul]
{
	@MODULE[ModuleCommand]
	{
		@RESOURCE[ElectricCharge]
		{
			@rate = 0.7
		}
	}
}

@PART[APUScrew2]:NEEDS[APUS_Shuttle,ProfileRealismOverhaul,FeatureComfort]:AFTER[RealismOverhaul]
{
	MODULE
	{
		name = Comfort
		bonus = panorama
		desc = Large windows give the VIP passengers a relaxing view of the planet below.
	}

	@tags ^= :$: comfort:
}

@PART[APUScockpit1]:NEEDS[APUS_Shuttle,FeatureHabitat]:AFTER[zzzKerbalism]
{
	@MODULE[Habitat]
	{
		%volume = 10
		%surface = 26
	}
}

@PART[APUScockpit2]:NEEDS[APUS_Shuttle,FeatureHabitat]:AFTER[zzzKerbalism]
{
	@MODULE[Habitat]
	{
		%volume = 14
		%surface = 32
	}
}

@PART[APUScrew1|APUScrew2]:NEEDS[APUS_Shuttle,FeatureHabitat]:AFTER[zzzKerbalism]
{
	@MODULE[Habitat]
	{
		%volume = 15
		%surface = 35
	}
}

@PART[APUSentrance1]:NEEDS[APUS_Shuttle,FeatureHabitat]:AFTER[zzzKerbalism]
