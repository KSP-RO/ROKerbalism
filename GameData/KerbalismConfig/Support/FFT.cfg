// ============================================================================
// Atmosphere scoop: gas-giant He-3 / Deuterium harvester
// Sources:
//   Mahaffy et al. 1998, Space Sci. Rev. 84 (Galileo GPMS): Jupiter He3/He4 = 1.66e-4, D/H = 2.6e-5
//   von Zahn et al. 1998, JGR 103 (Galileo HAD): Jupiter He mass fraction 0.238
// Abundances: ResourceConfigs/He-3.cfg and Deuterium.cfg. Rates are given at Jupiter abundance.
// ============================================================================
@PART[fft-atmosphere-scoop-1]:NEEDS[Kerbalism,FarFutureTechnologies]:AFTER[KerbalismDefault]
{
	!MODULE[ModuleSpaceDustHarvester],* {}
	!MODULE[PlannerController],* {}

	// the intake-type switch only retuned the SpaceDust module; keep the cosmetic switch, drop its module data
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[lengthSwitch]]
	{
		@SUBTYPE,*
		{
			!MODULE,* {}
		}
	}

	%tags = _kerbalism, scoop, atmosphere, harvester, isru, he3, helium, deuterium, fusion, gas giant

	MODULE
	{
		name = Harvester
		title = Atmospheric He-3 Separator
		type = 2
		resource = He3
		min_abundance = 0.000001 // 1 ppm: gas giants only
		abundance_rate = 0.000022 // Jupiter, 22 ppm
		rate = 0.0437 // gas litres; same mass as the old 0.0001 LqdHe3
		ec_rate = 3000.0
	}

	MODULE
	{
		name = Harvester
		title = Atmospheric Deuterium Separator
		type = 2
		resource = Deuterium
		min_abundance = 0.000001 // 1 ppm: gas giants only
		abundance_rate = 0.000045 // Jupiter, 45 ppm
		rate = 0.04535 // gas litres; same mass as the old 0.00005 LqdDeuterium
		ec_rate = 2000.0
	}

	// No liquefiers here: the scoop only harvests gas. Liquefy it on the Nuclear Smelter (factory principle).
	processConfigureExclude = true
	MODULE
	{
		name = Configure
		title = Atmosphere Scoop
		slots = 2

		SETUP
		{
			name = None
			desc = Empty slot for mass and cost savings.
		}

		SETUP
		{
			name = Atmospheric He-3 Separator
			desc = Separate <b>He3</b> gas from a gas giant's atmosphere.

			MODULE
			{
				type = Harvester
				id_field = title
				id_value = Atmospheric He-3 Separator
			}
			RESOURCE
			{
				name = He3
				amount = 0
				maxAmount = 200 // ~1 h of gas output at Jupiter
			}
		}

		SETUP
		{
			name = Atmospheric Deuterium Separator
			desc = Separate <b>Deuterium</b> gas from a gas giant's atmosphere.

			MODULE
			{
				type = Harvester
				id_field = title
				id_value = Atmospheric Deuterium Separator
			}
			RESOURCE
			{
				name = Deuterium
				amount = 0
				maxAmount = 200
			}
		}
	}
}

// ============================================================================
// Exosphere scoop
// Sources (full list in ResourceConfigs/Exosphere.cfg):
//   Gases: density x FFT intake (1000 m2) x orbital speed at the reference body
//     Hydrogen     Earth exobase 4.4e4 cm^-3 [Rairden86]
//     He3          Moon 13.4 cm^-3 [MoonFS][Benna15][ApolloSWC]
//     Deuterium    Venus exobase 960 cm^-3 [PVO-UVS][Donahue82]
//   Antimatter: < 1 t of coil per ug/yr collected [Bickford07] -> 14 t part = 14 ug/yr (GCR background)
// ============================================================================
@PART[fft-exosphere-scoop-1]:NEEDS[Kerbalism,FarFutureTechnologies]:AFTER[KerbalismDefault]
{
	!MODULE[ModuleSpaceDustHarvester],* {}
	!MODULE[PlannerController],* {}

	%tags = _kerbalism, scoop, exosphere, harvester, isru, antimatter, antiproton, he3, helium, deuterium, hydrogen

	MODULE
	{
		name = Harvester
		title = Exospheric Hydrogen Scoop
		type = 3
		resource = Hydrogen
		min_abundance = 0
		abundance_rate = 0.00044 // Earth exobase, 4.4e4 cm^-3
		rate = 0.0000062 // gaseous H2 units (was 7.9e-9 LqdHydrogen, same mass)
		ec_rate = 50
	}

	MODULE
	{
		name = Harvester
		title = Exospheric He-3 Scoop
		type = 3
		resource = He3
		min_abundance = 0
		abundance_rate = 0.000000134 // Moon, 13.4 cm^-3
		rate = 0.000000000813 // gas litres (was 1.86e-12 LqdHe3, same mass)
		ec_rate = 50
	}

	MODULE
	{
		name = Harvester
		title = Exospheric Deuterium Scoop
		type = 3
		resource = Deuterium
		min_abundance = 0
		abundance_rate = 0.0000096 // Venus exobase, 960 cm^-3
		rate = 0.000000129 // gas litres (was 1.42e-10 LqdDeuterium, same mass)
		ec_rate = 50
	}

	MODULE
	{
		name = Harvester
		title = Antiproton Magnetic Collector
		type = 3
		resource = Antimatter
		min_abundance = 0
		abundance_rate = 0.000000027 // GCR background, 2.7e-14 ng/km^3
		rate = 0.000000000444
		ec_rate = 50
	}

	processConfigureExclude = true
	MODULE
	{
		name = Configure
		title = Exosphere Scoop
		slots = 2

		SETUP
		{
			name = None
			desc = Empty slot for mass and cost savings.
		}

		SETUP
		{
			name = Exospheric Hydrogen Scoop
			desc = Scoop <b>Hydrogen</b> gas from a planet's exosphere.

			MODULE
			{
				type = Harvester
				id_field = title
				id_value = Exospheric Hydrogen Scoop
			}
			RESOURCE
			{
				name = Hydrogen
				amount = 0
				maxAmount = 1 // small gas buffer so the scoop has somewhere to put its output
			}
		}

		SETUP
		{
			name = Exospheric He-3 Scoop
			desc = Scoop <b>He3</b> gas from an exosphere.

			MODULE
			{
				type = Harvester
				id_field = title
				id_value = Exospheric He-3 Scoop
			}
			RESOURCE
			{
				name = He3
				amount = 0
				maxAmount = 1
			}
		}

		SETUP
		{
			name = Exospheric Deuterium Scoop
			desc = Scoop <b>Deuterium</b> gas from an exosphere.

			MODULE
			{
				type = Harvester
				id_field = title
				id_value = Exospheric Deuterium Scoop
			}
			RESOURCE
			{
				name = Deuterium
				amount = 0
				maxAmount = 1
			}
		}

		SETUP
		{
			name = Antiproton Magnetic Collector
			desc = Trap <b>Antimatter</b> (antiprotons) from the cosmic-ray background and planetary radiation belts.

			MODULE
			{
				type = Harvester
				id_field = title
				id_value = Antiproton Magnetic Collector
			}
		}
	}
}

@PART[fft-antimatter-factory-1]:NEEDS[Kerbalism,FarFutureTechnologies]:AFTER[KerbalismDefault]
{
	!MODULE[ModuleResourceConverter],* {}
	!MODULE[ModuleSystemHeatConverter],* {}

	MODULE
	{
		name = ProcessController
		resource = _AntimatterLH2
		title = Antimatter Synthesis (LH2)
		capacity = 1.0
	}

	MODULE
	{
		name = ProcessController
		resource = _AntimatterPellets
		title = Antimatter Synthesis (Pellets)
		capacity = 1.0
	}

	MODULE
	{
		name = Configure
		title = Antimatter Factory
		slots = 1

		SETUP
		{
			name = Antimatter Synthesis (LH2)
			desc = High-energy pair production converting <b>LqdHydrogen</b> into <b>Antimatter</b> using massive amounts of ElectricCharge.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _AntimatterLH2
			}
		}

		SETUP
