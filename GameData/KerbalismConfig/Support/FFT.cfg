@PART[fft-nuclear-smelter-375-1]:NEEDS[Kerbalism,FarFutureTechnologies]:AFTER[KerbalismDefault]
{
	!MODULE[ModuleResourceConverter],* {}
	!MODULE[ModuleSystemHeatConverter],* {}

	MODULE
	{
		name = ProcessController
		resource = _FissionPelletMfg
		title = Fission Pellet Fabricator
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _FissionParticleMfg
		title = Fission Particle Fabricator
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _FusionPelletMfg
		title = Fusion Pellet Fabricator
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _NSWSynthesis
		title = Nuclear Salt Water Processor
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _DeuteriumProduction
		title = Deuterium Separator
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _TritiumProduction
		title = Tritium Breeder
		capacity = 10.0
	}

	MODULE
	{
		name = Configure
		title = Nuclear Smelter
		slots = 2

		SETUP
		{
			name = Fission Pellet Fabricator
			desc = Process <b>EnrichedUranium</b> into <b>FissionPellets</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _FissionPelletMfg
			}
		}

		SETUP
		{
			name = Fission Particle Fabricator
			desc = Process <b>EnrichedUranium</b> into <b>FissionParticles</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _FissionParticleMfg
			}
		}

		SETUP
		{
			name = Fusion Pellet Fabricator
			desc = Process <b>LqdDeuterium</b> and <b>LqdHe3</b> into <b>FusionPellets</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _FusionPelletMfg
			}
		}

		SETUP
		{
			name = Nuclear Salt Water Processor
			desc = Mix <b>EnrichedUranium</b> and <b>Water</b> into <b>NuclearSaltWater</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _NSWSynthesis
			}
		}

		SETUP
		{
			name = Deuterium Separator
			desc = Extract <b>LqdDeuterium</b> from <b>Water</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _DeuteriumProduction
			}
		}

		SETUP
		{
			name = Tritium Breeder
			desc = Breed <b>LqdTritium</b> from <b>Lithium</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _TritiumProduction
			}
		}
	}
}


