@PART[fft-nuclear-smelter-375-1]:NEEDS[Kerbalism,FarFutureTechnologies]:AFTER[KerbalismDefault]
{
	!MODULE[ModuleResourceConverter],* {}
	!MODULE[ModuleSystemHeatConverter],* {}

	MODULE
	{
		name = ProcessController
		resource = _FissionPelletMfg
		title = Fission Pellet Fabricator
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _FissionParticleMfg
		title = Fission Particle Fabricator
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _FusionPelletMfg
		title = Fusion Pellet Fabricator
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _NSWSynthesis
		title = Nuclear Salt Water Processor
		capacity = 10.0
	}

	MODULE
	{
		name = ProcessController
		resource = _DeuteriumProduction
		title = Deuterium Separator
		capacity = 10.0 // 2 kg/s Water, 31.7 MW, 0.056 g/s D
	}

	MODULE
	{
		name = ProcessController
		resource = _D2Converter
		title = Deuterium Liquefier
		capacity = 6 // 0.06 g/s, above the separator's 0.056 g/s
	}

	MODULE
	{
		name = ProcessController
		resource = _He3Converter
		title = He-3 Liquefier
		capacity = 3 // 0.03 g/s, above the heavy regolith scoop's 0.0235 g/s peak
	}

	MODULE
	{
		name = ProcessController
		resource = _TritiumProduction
		title = Tritium Breeder
		capacity = 10.0
	}

	MODULE
	{
		name = Configure
		title = Nuclear Smelter
		slots = 2

		SETUP
		{
			name = Fission Pellet Fabricator
			desc = Process <b>EnrichedUranium</b> into <b>FissionPellets</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _FissionPelletMfg
			}
		}

		SETUP
		{
			name = Fission Particle Fabricator
			desc = Process <b>EnrichedUranium</b> into <b>FissionParticles</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _FissionParticleMfg
			}
		}

		SETUP
		{
			name = Fusion Pellet Fabricator
			desc = Process <b>LqdDeuterium</b> and <b>LqdHe3</b> into <b>FusionPellets</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _FusionPelletMfg
			}
		}

		SETUP
		{
			name = Nuclear Salt Water Processor
			desc = Mix <b>EnrichedUranium</b> and <b>Water</b> into <b>NuclearSaltWater</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _NSWSynthesis
			}
		}

		SETUP
		{
			name = Deuterium Separator
			desc = Electrolyse <b>Water</b> to extract <b>Deuterium</b> gas (CECE). Byproducts: <b>Hydrogen</b> and <b>Oxygen</b>. Fit a Deuterium Liquefier to turn the gas into <b>LqdDeuterium</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _DeuteriumProduction
			}
			RESOURCE
			{
				name = Deuterium
				amount = 0
				maxAmount = 1200 // ~1 h of separator output
			}
		}

		SETUP
		{
			name = Deuterium Liquefier
			desc = Liquefy <b>Deuterium</b> gas from the separator or the scoops into <b>LqdDeuterium</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _D2Converter
			}
			RESOURCE
			{
				name = Deuterium
				amount = 0
				maxAmount = 1200 // ~1 h of separator output
			}
		}

		SETUP
		{
			name = He-3 Liquefier
			desc = Liquefy <b>He3</b> gas from the scoops into <b>LqdHe3</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _He3Converter
			}
			RESOURCE
			{
				name = He3
				amount = 0
				maxAmount = 800 // ~1 h of heavy regolith scoop peak output
			}
		}

		SETUP
		{
			name = Tritium Breeder
			desc = Breed <b>LqdTritium</b> from <b>Lithium</b>.

			MODULE
			{
				type = ProcessController
				id_field = resource
				id_value = _TritiumProduction
			}
		}
	}
}


