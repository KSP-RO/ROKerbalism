// ============================================================================
// CALLISTO
// Mission Data: NASA Galileo Magnetometer & Gravity Data
// Physical Context: Heavily cratered mixture of rock, hydrated dust, and ice
// ============================================================================

// ----------------------------------------------------------------------------
// Water
// ----------------------------------------------------------------------------
PLANETARY_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Callisto

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 40
        MaxAbundance = 70
        Variance = 15
        Dispersal = 2
    }
}

// ----------------------------------------------------------------------------
// Carbon dioxide
// ----------------------------------------------------------------------------
// Galileo NIMS, Hibbitts et al. 2002 (JGR 107): CO2 is 0.01-0.16% of the host material mass, held in the non-ice
// material, more on the trailing hemisphere (Hibbitts et al. 2000, JGR 105).
PLANETARY_RESOURCE
{
    ResourceName = CarbonDioxide
    ResourceType = 0
    PlanetName = Callisto

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0.01
        MaxAbundance = 0.16
        Variance = 50
        Dispersal = 3
    }
}

// Fresh impact craters and ejecta are CO2-rich, e.g. the young craters in the Asgard basin (Hibbitts et al. 2002);
// capped at Hibbitts et al.'s <=0.3 wt% upper limit for the top ~1 mm
BIOME_RESOURCE
{
    ResourceName = CarbonDioxide
    ResourceType = 0
    PlanetName = Callisto
    BiomeName = Asgard Crater

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0.16
        MaxAbundance = 0.3
        Variance = 30
        Dispersal = 3
    }
}

BIOME_RESOURCE
{
    ResourceName = CarbonDioxide
    ResourceType = 0
    PlanetName = Callisto
    BiomeName = Young Craters

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0.16
        MaxAbundance = 0.3
        Variance = 30
        Dispersal = 3
    }
}
