// ============================================================================
// GANYMEDE
// Mission Data: NASA Galileo Flybys & Hubble Space Telescope STIS
// Physical Context: Ice-silicate surface mantle and sandwiched ocean layers
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Hibbitts et al. 2003, JGR 108: https://doi.org/10.1029/2002je001956
// Bockelee-Morvan et al. 2024, A&A 681: https://doi.org/10.1051/0004-6361/202347326
// King & Fletcher 2022, JGR Planets 127: https://doi.org/10.1029/2022JE007323
// Ligier et al. 2019, Icarus 333: https://doi.org/10.1016/j.icarus.2019.06.013

// ----------------------------------------------------------------------------
// Water
// ----------------------------------------------------------------------------
// VLT/SPHERE global mapping, King & Fletcher 2022 (JGR Planets 127): H2O ice generally 15-50%, highest around the polar caps
// and lowest on the trailing hemisphere. VLT/SINFONI, Ligier et al. 2019 (Icarus 333): mean 29% (20.7% crystalline + 8.5%
// amorphous), with a dark agent the dominant compound at ~53%.
PLANETARY_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Ganymede

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 15
        MaxAbundance = 50
        Variance = 50
        Dispersal = 3
    }
}
// Polar caps: the richest ice on Ganymede (King & Fletcher 2022), from the global mean of 29% up to 50%
BIOME_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Ganymede
    BiomeName = Poles

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 29
        MaxAbundance = 50
        Variance = 30
        Dispersal = 3
    }
}
// Craters: enriched in crystalline ice, almost 50% at Osiris (Ligier et al. 2019)
BIOME_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Ganymede
    BiomeName = Craters

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 29
        MaxAbundance = 50
        Variance = 30
        Dispersal = 3
    }
}

// ----------------------------------------------------------------------------
// Carbon dioxide
// ----------------------------------------------------------------------------
// Galileo NIMS, Hibbitts et al. 2003 (JGR 108): CO2 does not exceed parts per thousand (<=0.1%);
// JWST NIRSpec Hapke modeling, Bockelee-Morvan et al. 2024 (A&A 681): roughly 1% by mass trapped in the water ice.
// Range spans the two measurements.
PLANETARY_RESOURCE
{
    ResourceName = CarbonDioxide
    ResourceType = 0
    PlanetName = Ganymede

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0.1
        MaxAbundance = 1
        Variance = 50
        Dispersal = 3
    }
}
