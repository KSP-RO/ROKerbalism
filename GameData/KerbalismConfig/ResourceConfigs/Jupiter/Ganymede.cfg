// ----------------------------------------------------------------------------
// Carbon dioxide
// ----------------------------------------------------------------------------
// Galileo NIMS, Hibbitts et al. 2003 (JGR 108): CO2 does not exceed parts per thousand (<=0.1%);
// JWST NIRSpec Hapke modeling, Bockelee-Morvan et al. 2024 (A&A 681): roughly 1% by mass trapped in the water ice.
// Range spans the two measurements.
PLANETARY_RESOURCE
{
    ResourceName = CarbonDioxide
    ResourceType = 0
    PlanetName = Ganymede

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0.1
        MaxAbundance = 1
        Variance = 50
        Dispersal = 3
    }
}
