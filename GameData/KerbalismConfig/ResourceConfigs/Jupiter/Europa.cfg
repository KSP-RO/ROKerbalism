// ============================================================================
// EUROPA
// Mission Data: NASA Galileo Magnetometer & Solid State Imaging (SSI)
// Physical Context: Water ice outer shell overlying global subsurface ocean
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Trumbo & Brown 2023, Science 381: https://doi.org/10.1126/science.adg4155
// Villanueva et al. 2023, Science 381: https://doi.org/10.1126/science.adg4270
// Ligier et al. 2016, AJ 151: https://doi.org/10.3847/0004-6256/151/6/163

// ----------------------------------------------------------------------------
// Water
// ----------------------------------------------------------------------------
// VLT/SINFONI linear unmixing, Ligier et al. 2016 (AJ 151, 163): total H2O ice rises to almost 90% on the bright terrain,
// and needs at least 15% to reproduce the 1.65 um band in the sulfuric-acid-rich trailing terrain.
PLANETARY_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Europa

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 15
        MaxAbundance = 90
        Variance = 50
        Dispersal = 3
    }
}

// ----------------------------------------------------------------------------
// Carbon dioxide
// ----------------------------------------------------------------------------
// JWST NIRSpec, Trumbo & Brown 2023 & Villanueva et al. 2023 (Science 381): CO2 concentrated in the chaos terrain
// of Tara Regio, sourced from the ocean. Both papers map band strength only, no abundance is published:
BIOME_RESOURCE
{
    ResourceName = CarbonDioxide
    ResourceType = 0
    PlanetName = Europa
    BiomeName = Chaotic Plains

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0.01
        MaxAbundance = 0.1
        Variance = 50
        Dispersal = 3
    }
}
