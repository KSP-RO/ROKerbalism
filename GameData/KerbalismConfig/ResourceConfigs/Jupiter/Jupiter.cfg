// ============================================================================
// JUPITER
// Mission Data: Galileo Probe (GPMS & HAD, 1995), Juno MWR
// Physical Context: H2/He envelope, NH3 ice and NH4SH cloud decks over a deep water cloud layer
// ============================================================================

// ----------------------------------------------------------------------------
// Bulk atmosphere
// ----------------------------------------------------------------------------
// source: Galileo Probe Helium Abundance Detector, von Zahn et al. 1998 (JGR 103, E10): He/H2 = 0.157 -> 13.6% He, 86.2% H2
PLANETARY_RESOURCE
{
    ResourceName = Hydrogen
    ResourceType = 2
    PlanetName = Jupiter

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 86.0
        MaxAbundance = 86.4
        Variance = 0
        Dispersal = 0
    }
}

PLANETARY_RESOURCE
{
    ResourceName = Helium
    ResourceType = 2
    PlanetName = Jupiter

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 13.4
        MaxAbundance = 13.8
        Variance = 0
        Dispersal = 0
    }
}

// ----------------------------------------------------------------------------
