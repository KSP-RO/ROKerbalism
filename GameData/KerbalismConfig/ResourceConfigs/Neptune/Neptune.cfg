// ============================================================================
// NEPTUNE
// Mission Data: Voyager 2 IRIS & radio occultation, Herschel PACS
// Physical Context: H2/He/CH4 envelope over a water-ammonia-methane ice giant mantle
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Conrath et al. 1991, JGR 96: https://doi.org/10.1029/91ja01703
// Baines et al. 1995, Icarus 114: https://doi.org/10.1006/icar.1995.1065
// Lindal 1992, AJ 103: https://doi.org/10.1086/116119

// ----------------------------------------------------------------------------
// Bulk atmosphere
// ----------------------------------------------------------------------------
// source: Voyager 2, Conrath et al. 1991 (JGR 96): He mole fraction 0.19 +/- 0.03
PLANETARY_RESOURCE
{
    ResourceName = Hydrogen
    ResourceType = 2
    PlanetName = Neptune

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 77
        MaxAbundance = 82
        Variance = 0
        Dispersal = 0
    }
}

PLANETARY_RESOURCE
{
    ResourceName = Helium
    ResourceType = 2
    PlanetName = Neptune

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 16
        MaxAbundance = 22
        Variance = 0
        Dispersal = 0
    }
}

// ----------------------------------------------------------------------------
// Trace gases
// ----------------------------------------------------------------------------
// source: Baines et al. 1995 (Icarus 114) & Lindal 1992 (AJ 103): ~1.5-2% CH4 below the clouds
// NH3 and H2O condense far below the observable atmosphere and have never been measured, so they are left out.
PLANETARY_RESOURCE
{
    ResourceName = Methane
    ResourceType = 2
    PlanetName = Neptune

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 1.5
        MaxAbundance = 2
        Variance = 0
        Dispersal = 0
    }
}
