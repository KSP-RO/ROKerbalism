// ============================================================================
// SATURN
// Mission Data: Voyager 1/2 IRIS & radio occultation, Cassini CIRS/VIMS, ISO
// Physical Context: H2/He envelope, helium partly rained out into the interior
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Conrath & Gautier 2000, Icarus 144: https://doi.org/10.1006/icar.1999.6265
// Fletcher et al. 2009, Icarus 199: https://doi.org/10.1016/j.icarus.2008.09.019
// Fletcher et al. 2011, Icarus 214: https://doi.org/10.1016/j.icarus.2011.06.006

// ----------------------------------------------------------------------------
// Bulk atmosphere
// ----------------------------------------------------------------------------
// source: Conrath & Gautier 2000 (Icarus 144): He mass fraction Y = 0.18-0.25 -> 10-14% He by volume.
// (The original Voyager value of 3.25% He is now known to be too low.)
PLANETARY_RESOURCE
{
    ResourceName = Hydrogen
    ResourceType = 2
    PlanetName = Saturn

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 85.5
        MaxAbundance = 89.5
        Variance = 0
        Dispersal = 0
    }
}

PLANETARY_RESOURCE
{
    ResourceName = Helium
    ResourceType = 2
    PlanetName = Saturn

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 10
        MaxAbundance = 14
        Variance = 0
        Dispersal = 0
    }
}

