// ----------------------------------------------------------------------------
// Water
// ----------------------------------------------------------------------------
// Cassini VIMS Hapke model, Filacchione et al. 2012 (Icarus 220), Table 7: 99.992% water ice, 0.008% tholin
PLANETARY_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Enceladus

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 99
        MaxAbundance = 100
        Variance = 5
        Dispersal = 1
    }
}

// ----------------------------------------------------------------------------
// Plume volatiles
