// ============================================================================
// IAPETUS
// Mission Data: Cassini VIMS
// Physical Context: Two-tone moon: bright water-ice trailing side and poles, dark leading side (Cassini Regio) coated in a carbon-rich lag
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Buratti et al. 2005, ApJ 622: https://doi.org/10.1086/429800
// Clark et al. 2012, Icarus 218: https://doi.org/10.1016/j.icarus.2012.01.008
// Spencer & Denk 2010, Science 327: https://doi.org/10.1126/science.1177132

// ----------------------------------------------------------------------------
// Water
// ----------------------------------------------------------------------------
// Buratti et al. 2005 (ApJ 622, L149): the brightest terrain is ~75% water ice, the dark terrain a few percent at most.
// Water ice increases within the dark material away from its apex (Clark et al. 2012, Icarus 218), as ice migrates
// off the warm dark equator (thermal segregation, Spencer & Denk 2010, Science 327).
// RSS has no biome for the dark hemisphere, so the global range spans dark to bright terrain.
PLANETARY_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Iapetus

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 1
        MaxAbundance = 75
        Variance = 50
        Dispersal = 3
    }
}

// Poles: bright terrain on both hemispheres
BIOME_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Iapetus
    BiomeName = Northern Polar Region

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 65
        MaxAbundance = 75
        Variance = 20
        Dispersal = 3
    }
}

BIOME_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Iapetus
    BiomeName = Southern Polar Region

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 65
        MaxAbundance = 75
        Variance = 20
        Dispersal = 3
    }
}
