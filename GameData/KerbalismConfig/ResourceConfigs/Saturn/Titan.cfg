// ----------------------------------------------------------------------------
// Hydrocarbon seas
// ----------------------------------------------------------------------------
// source: Cassini RADAR, Le Gall et al. 2016 (JGR Planets 121) & Mastrogiuseppe et al. 2014 (GRL 41):
// Ligeia Mare is ~71% CH4, 12% C2H6, 17% dissolved N2. The seas are liquid hydrocarbons, not water-ice bedrock.
