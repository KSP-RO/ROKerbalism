// ----------------------------------------------------------------------------
// Atmosphere
// ----------------------------------------------------------------------------
// source: Huygens GCMS, Niemann et al. 2010 (JGR 115, E12006): CH4 5.65% at the surface, 1.48% in the stratosphere; N2 makes up the rest
PLANETARY_RESOURCE
{
    ResourceName = Nitrogen
    ResourceType = 2
    PlanetName = Titan

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 94.3
        MaxAbundance = 98.5
        Variance = 0
        Dispersal = 0
    }
}

PLANETARY_RESOURCE
{
    ResourceName = Methane
    ResourceType = 2
    PlanetName = Titan

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 1.48
        MaxAbundance = 5.65
        Variance = 0
        Dispersal = 0
    }
}

