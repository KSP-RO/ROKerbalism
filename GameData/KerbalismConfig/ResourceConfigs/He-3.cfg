// ============================================================================
// SOLAR WIND He-3 IN REGOLITH
// Abundances are mass fractions: 1 ppb = 0.0000001 in the config 
// ============================================================================

// MOON - measured. Strongly bound He-3 in returned regolith by landing site (Slyuta, Abdrakhimov & Galimov 2007,LPSC 38 #2175, Table 1, compiled from the Apollo/Luna sample literature). 
// Each sampled mare gets its landing-site
// value +/-25% for regional spread. Fa & Jin 2007 (Icarus 190) map the richest deposits in the high-Ti basalts of
// Mare Tranquillitatis and Oceanus Procellarum.
// Global default = highland regolith: Apollo 16 1.4 ppb, Luna 20 3.1 ppb
PLANETARY_RESOURCE
{
	ResourceName = LqdHe3
	ResourceType = 0
	PlanetName = Moon
	Distribution
	{
		PresenceChance = 100
		MinAbundance = 0.00000014 // 1.4 ppb
		MaxAbundance = 0.00000031 // 3.1 ppb
		Variance = 50
		Dispersal = 3
	}
}

BIOME_RESOURCE
{
	ResourceName = LqdHe3
