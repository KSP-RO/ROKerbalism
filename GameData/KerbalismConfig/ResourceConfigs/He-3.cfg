// Not included: Slyuta et al. note theoretical weakly bound He-3 at high latitudes of up to 44 ppb, unmeasured.

// The bodies below have NO He-3 measurement. ESTIMATE: lunar highland He-3 (1.4-3.1 ppb) scaled by solar
// wind flux, which falls off as 1/r^2 with distance from the Sun (r in AU). Replace if a measurement appears.

// MERCURY (0.39 AU): 6.7x the lunar flux, but the magnetosphere shields most of the surface and the 700 K
// dayside drives implanted He back out (He release from lunar ilmenite starts at a few hundred C, Wittenberg
// et al. 1986, Fusion Technol. 10). No net gain is assumed: lunar highland range.
PLANETARY_RESOURCE
{
	ResourceName = LqdHe3
	ResourceType = 0
	PlanetName = Mercury
	Distribution
	{
		PresenceChance = 100
		MinAbundance = 0.00000014 // 1.4 ppb
		MaxAbundance = 0.00000031 // 3.1 ppb
		Variance = 50
		Dispersal = 3
	}
}

