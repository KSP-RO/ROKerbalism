PLANETARY_RESOURCE
{
	isHe3Template = true
	ResourceName = LqdHe3
	ResourceType = 0 
	Distribution
	{
		PresenceChance = 100
		MinAbundance = 0.0010   
		MaxAbundance = 0.0080   
		Variance = 50
		Dispersal = 3
	}
}

// Airless or weak-magnetosphere bodies exposed to solar wind weathering
+PLANETARY_RESOURCE:HAS[#isHe3Template,~PlanetName] { PlanetName = Moon }
+PLANETARY_RESOURCE:HAS[#isHe3Template,~PlanetName] { PlanetName = Mercury }
+PLANETARY_RESOURCE:HAS[#isHe3Template,~PlanetName] { PlanetName = Phobos }
+PLANETARY_RESOURCE:HAS[#isHe3Template,~PlanetName] { PlanetName = Deimos }
+PLANETARY_RESOURCE:HAS[#isHe3Template,~PlanetName] { PlanetName = Ceres }
+PLANETARY_RESOURCE:HAS[#isHe3Template,~PlanetName] { PlanetName = Vesta }

!PLANETARY_RESOURCE:HAS[#isHe3Template,~PlanetName] {}
@PLANETARY_RESOURCE:HAS[#isHe3Template] { !isHe3Template = delete }

// ============================================================================
// GAS GIANTS - atmospheric He-3
// LqdHe3 = He-3 share of the whole atmosphere (He fraction x He3/He4).
// ============================================================================

// JUPITER
// source: Galileo Probe GPMS, Mahaffy et al. 1998 (Space Sci. Rev. 84): He3/He4 = 1.66e-4, D/H = 2.6e-5
PLANETARY_RESOURCE
{
    ResourceName = LqdHe3
    ResourceType = 2
    PlanetName = Jupiter

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0.0022
        MaxAbundance = 0.0023
        Variance = 0
        Dispersal = 0
    }
}

// SATURN
// He3/He4 has never been measured on Saturn; LqdHe3 assumes the protosolar ratio found at Jupiter (1.66e-4). Estimate.
PLANETARY_RESOURCE
{
    ResourceName = LqdHe3
    ResourceType = 2
    PlanetName = Saturn

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0.0017
        MaxAbundance = 0.0023
        Variance = 0
        Dispersal = 0
    }
}

