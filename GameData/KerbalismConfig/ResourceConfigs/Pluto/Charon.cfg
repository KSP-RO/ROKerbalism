// ============================================================================
// CHARON
// Mission Data: NASA New Horizons Ralph/LEISA Infrared Spectrometer
// Physical Context: Surface is mostly frozen water
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Grundy et al. 2016, Science 351: https://doi.org/10.1126/science.aad9189
// Brown & Calvin 2000, Science 287: https://doi.org/10.1126/science.287.5450.107
// Cook et al. 2007, ApJ 663: https://doi.org/10.1086/518222
// Dalle Ore et al. 2018, Icarus 300: https://doi.org/10.1016/j.icarus.2017.08.026
// Protopapa et al. 2024, Nat. Commun. 15: https://doi.org/10.1038/s41467-024-51826-4

// ----------------------------------------------------------------------------
// Water
// ----------------------------------------------------------------------------
// JWST NIRSpec Hapke models, Protopapa et al. 2024 (Nat. Commun. 15): 83% crystalline H2O ice + 17% tholin-like material below
// 2.5 um, and 80% crystalline + 18% amorphous H2O ice + 2% CO2 near 3 um (the two wavelength ranges probe different depths).
PLANETARY_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Charon

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 83
        MaxAbundance = 98
        Variance = 15
        Dispersal = 2
    }
}

// ----------------------------------------------------------------------------
// Ammonia
// ----------------------------------------------------------------------------
// Ammonia hydrates are detected across Charon (Brown & Calvin 2000, Science 287; Cook et al. 2007, ApJ 663;
// New Horizons LEISA, Grundy et al. 2016, Science 351; Dalle Ore et al. 2018, Icarus 300), richest in small young
// craters such as Organa.
PLANETARY_RESOURCE
{
    ResourceName = Ammonia
    ResourceType = 0
    PlanetName = Charon

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0.5
        MaxAbundance = 2
        Variance = 50
        Dispersal = 3
    }
}
