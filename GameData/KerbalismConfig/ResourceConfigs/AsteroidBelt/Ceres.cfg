        MinAbundance = 15
        MaxAbundance = 30
        Variance = 20
        Dispersal = 3
    }
}

// ----------------------------------------------------------------------------
// Ammonia
// ----------------------------------------------------------------------------
// Abundances are NH3-equivalent wt% of the ammonium (NH4+) carried by the minerals.
// Global: Dawn VIR finds ammoniated phyllosilicates everywhere (De Sanctis et al. 2015, Nature 528).
// Lab fits to Ceres spectra need 28 wt% NH4-montmorillonite (Galiano et al. 2020, via Beck et al. 2021, Icarus 357)
// or 15 wt% around Ernutet (Minerals 11:719, 2021); NH4-montmorillonite holds ~0.3 wt% H as NH4+ (Pironon et al. 2003)
// -> 15-28 wt% x 0.3 wt% H x 17/4 = ~0.2-0.36 wt% NH3
PLANETARY_RESOURCE
{
    ResourceName = Ammonia
    ResourceType = 0
    PlanetName = Ceres

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0.2
        MaxAbundance = 0.36
        Variance = 50
        Dispersal = 3
    }
}

// White Spots (Occator faculae): up to 7 vol% NH4Cl (Raponi et al. 2019, Icarus 320, abundance maps;
// summarised by De Sanctis et al. 2021, MmSAI 92). NH4Cl is 32% NH3 by mass -> up to ~2 wt% NH3.
// Raponi et al. find NH4Cl negligible on the rest of Occator, so Occator Crater keeps the global value.
BIOME_RESOURCE
{
    ResourceName = Ammonia
    ResourceType = 0
    PlanetName = Ceres
    BiomeName = White Spots

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0.5
        MaxAbundance = 2
        Variance = 30
        Dispersal = 3
    }
}
