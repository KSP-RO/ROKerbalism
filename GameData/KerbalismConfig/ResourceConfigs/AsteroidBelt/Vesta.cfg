// Physical Context: Differentiated basaltic protoplanet; hydrated minerals delivered by carbonaceous-chondrite impactors
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Prettyman et al. 2012, Science 338: https://doi.org/10.1126/science.1225354
// Prettyman et al. 2014, NASA NTRS 20140012596: https://ntrs.nasa.gov/api/citations/20140012596/downloads/20140012596.pdf
// De Sanctis et al. 2012, ApJL 758: https://doi.org/10.1088/2041-8205/758/2/l36

// ----------------------------------------------------------------------------
// Water
// ----------------------------------------------------------------------------
// Dawn GRaND, Prettyman et al. 2012 (Science 338) & 2014 (NASA NTRS 20140012596): hydrogen spans ~0-400 ug/g, highest in the dark
// equatorial hemisphere (exogenic, carbonaceous-chondrite infall), lowest in the young Rheasilvia basin.
// Bound as OH / H2O in minerals (De Sanctis et al. 2012, ApJL 758), not ice. 400 ug/g H x 9 = 0.36 wt% water equivalent.
PLANETARY_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Vesta

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0
        MaxAbundance = 0.36
        Variance = 50
        Dispersal = 3
    }
}
