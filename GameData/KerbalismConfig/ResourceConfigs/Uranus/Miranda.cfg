// ============================================================================
// MIRANDA
// Mission Data: Voyager 2 imaging, IRTF SpeX near-infrared spectroscopy
// Physical Context: Water ice with coronae and giant fault scarps; ammonia at 2.2 um, no CO2 ice
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// DeColibus et al. 2023, PSJ 4: https://doi.org/10.3847/psj/acf834

// ----------------------------------------------------------------------------
// Water
// ----------------------------------------------------------------------------
// Hapke-Mie models of DeColibus et al. 2023 (PSJ 4, "Are NH3 and CO2 Ice Present on Miranda?", Table 8): 93-95% H2O ice
PLANETARY_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Miranda

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 93
        MaxAbundance = 95
        Variance = 20
        Dispersal = 3
    }
}

// ----------------------------------------------------------------------------
// Ammonia
// ----------------------------------------------------------------------------
// Same paper: the 2.2 um band is best matched by NH3 ice with NH3 hydrates, modeled at 1-3%
// (the authors note the fits are non-unique). No CO2 ice was found.
PLANETARY_RESOURCE
{
    ResourceName = Ammonia
    ResourceType = 0
    PlanetName = Miranda

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 1
        MaxAbundance = 3
        Variance = 50
        Dispersal = 3
    }
}
