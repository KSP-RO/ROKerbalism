// ============================================================================
// UMBRIEL
// Mission Data: Voyager 2 imaging, IRTF SpeX near-infrared spectroscopy
// Physical Context: Darkest Uranian moon, water ice mixed with a large dark (carbon-rich) fraction
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Cartwright et al. 2015, Icarus 257: https://doi.org/10.1016/j.icarus.2015.05.020

// ----------------------------------------------------------------------------
// Water
// ----------------------------------------------------------------------------
// IRTF SpeX best-fit model of the trailing hemisphere, Cartwright et al. 2015 (Icarus 257), Table B1 -> 55% H2O ice (60% H2O x 92% particulate fraction, the rest is dark amorphous carbon)
PLANETARY_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Umbriel

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 50
        MaxAbundance = 61
        Variance = 30
        Dispersal = 3
    }
}

// ----------------------------------------------------------------------------
// Carbon dioxide
// ----------------------------------------------------------------------------
// IRTF SpeX best-fit model of the trailing hemisphere, Cartwright et al. 2015 (Icarus 257), Table B1 -> 8% CO2 ice on the trailing side; all fits need at least 1% CO2 (same paper)
PLANETARY_RESOURCE
{
    ResourceName = CarbonDioxide
    ResourceType = 0
    PlanetName = Umbriel

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 1
        MaxAbundance = 8
        Variance = 50
        Dispersal = 3
    }
}
