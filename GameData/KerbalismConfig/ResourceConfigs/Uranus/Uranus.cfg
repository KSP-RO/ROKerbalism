// ============================================================================
// URANUS
// Mission Data: Voyager 2 IRIS & radio occultation, HST STIS, Herschel PACS
// Physical Context: H2/He/CH4 envelope over a water-ammonia-methane ice giant mantle
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Conrath et al. 1987, JGR 92: https://doi.org/10.1029/ja092ia13p15003
// Lindal et al. 1987, JGR 92: https://doi.org/10.1029/ja092ia13p14987
// Sromovsky et al. 2011, Icarus 215: https://doi.org/10.1016/j.icarus.2011.06.024

// ----------------------------------------------------------------------------
// Bulk atmosphere
// ----------------------------------------------------------------------------
// source: Voyager 2, Conrath et al. 1987 (JGR 92): He mole fraction 0.152 +/- 0.033
PLANETARY_RESOURCE
{
    ResourceName = Hydrogen
    ResourceType = 2
    PlanetName = Uranus

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 79
        MaxAbundance = 84
        Variance = 0
        Dispersal = 0
    }
}

PLANETARY_RESOURCE
{
    ResourceName = Helium
    ResourceType = 2
    PlanetName = Uranus

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 12
        MaxAbundance = 18.5
        Variance = 0
        Dispersal = 0
    }
}

// ----------------------------------------------------------------------------
// Trace gases
// ----------------------------------------------------------------------------
// source: Voyager 2 radio occultation, Lindal et al. 1987 (JGR 92): 2.3% CH4 below the clouds;
// HST STIS, Sromovsky et al. 2011 (Icarus 215): up to ~4% at low latitudes
// NH3 and H2O condense far below the observable atmosphere and have never been measured, so they are left out.
PLANETARY_RESOURCE
{
    ResourceName = Methane
    ResourceType = 2
    PlanetName = Uranus

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 2.3
        MaxAbundance = 4
        Variance = 0
        Dispersal = 0
    }
}
