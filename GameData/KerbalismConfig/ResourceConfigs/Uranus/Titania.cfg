// ============================================================================
// TITANIA
// Mission Data: Voyager 2 Spacecraft & IRTF Ground-Based IR Spectroscopy
// Physical Context: Mixed water ice crust with dark carbonaceous/organic matter
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Cartwright et al. 2015, Icarus 257: https://doi.org/10.1016/j.icarus.2015.05.020
// Grundy et al. 2006, Icarus 184: https://doi.org/10.1016/j.icarus.2006.04.016

// ----------------------------------------------------------------------------
// Water
// ----------------------------------------------------------------------------
// IRTF SpeX best-fit model of the trailing hemisphere, Cartwright et al. 2015 (Icarus 257), Table B1
// -> 82% H2O ice (86% H2O x 95% particulate fraction, the rest is dark amorphous carbon)
PLANETARY_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Titania

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 74
        MaxAbundance = 90
        Variance = 15
        Dispersal = 3
    }
}

// ----------------------------------------------------------------------------
// Carbon dioxide
// ----------------------------------------------------------------------------
// IRTF SpeX & Spitzer IRAC, Cartwright et al. 2015 (Icarus 257): spectral models need CO2 ice at >=1%
// to fit, and models consistent with the IRAC photometry allow 1-5% CO2 ice; concentrated on the trailing hemisphere
// (Grundy et al. 2006, Icarus 184), less than on Ariel and Umbriel.
PLANETARY_RESOURCE
{
    ResourceName = CarbonDioxide
    ResourceType = 0
    PlanetName = Titania

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 1
        MaxAbundance = 5
        Variance = 50
        Dispersal = 3
    }
}
