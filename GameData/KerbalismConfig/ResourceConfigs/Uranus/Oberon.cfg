// ============================================================================
// OBERON
// Mission Data: Voyager 2 imaging, IRTF SpeX near-infrared spectroscopy
// Physical Context: Outermost large Uranian moon, water ice with dark material, the least CO2 of the four
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Cartwright et al. 2015, Icarus 257: https://doi.org/10.1016/j.icarus.2015.05.020

// ----------------------------------------------------------------------------
// Water
// ----------------------------------------------------------------------------
// IRTF SpeX best-fit model of the trailing hemisphere, Cartwright et al. 2015 (Icarus 257), Table B1 -> 73% H2O ice (74.9% H2O x 97% particulate fraction)
PLANETARY_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Oberon

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 65
        MaxAbundance = 80
        Variance = 30
        Dispersal = 3
    }
}

// ----------------------------------------------------------------------------
// Carbon dioxide
// ----------------------------------------------------------------------------
// IRTF SpeX best-fit model of the trailing hemisphere, Cartwright et al. 2015 (Icarus 257), Table B1 -> 3% CO2 ice on the trailing side; all fits need at least 1% CO2 (same paper)
PLANETARY_RESOURCE
{
    ResourceName = CarbonDioxide
    ResourceType = 0
    PlanetName = Oberon

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 1
        MaxAbundance = 3
        Variance = 50
        Dispersal = 3
    }
}
