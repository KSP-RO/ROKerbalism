// ============================================================================
// ARIEL
// Mission Data: Voyager 2 imaging, IRTF SpeX near-infrared spectroscopy
// Physical Context: Water ice crust with the strongest CO2 ice of the Uranian moons, young chasmata and possible ammonia from recent activity
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Cartwright et al. 2015, Icarus 257: https://doi.org/10.1016/j.icarus.2015.05.020
// Cartwright et al. 2020, ApJL 898: https://doi.org/10.3847/2041-8213/aba27f
// DeColibus et al. 2023, PSJ 4: https://doi.org/10.3847/psj/acf834

// ----------------------------------------------------------------------------
// Water
// ----------------------------------------------------------------------------
// trailing hemisphere: IRTF SpeX best-fit model of the trailing hemisphere, Cartwright et al. 2015 (Icarus 257), Table B1 -> 71% H2O ice (97.8% H2O x 73% particulate fraction)
// leading hemisphere: continuum model of Cartwright et al. 2020 (ApJL 898, L22), 86.7% H2O ice
PLANETARY_RESOURCE
{
    ResourceName = Water
    ResourceType = 0
    PlanetName = Ariel

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 71
        MaxAbundance = 87
        Variance = 30
        Dispersal = 3
    }
}

// ----------------------------------------------------------------------------
// Carbon dioxide
// ----------------------------------------------------------------------------
// trailing hemisphere: IRTF SpeX best-fit model of the trailing hemisphere, Cartwright et al. 2015 (Icarus 257), Table B1 -> 27% CO2 ice (areal)
// leading hemisphere: Cartwright et al. 2020 continuum model, 9.5% CO2 ice
PLANETARY_RESOURCE
{
    ResourceName = CarbonDioxide
    ResourceType = 0
    PlanetName = Ariel

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 9.5
        MaxAbundance = 27
        Variance = 50
        Dispersal = 3
    }
}

// ----------------------------------------------------------------------------
// Ammonia
// ----------------------------------------------------------------------------
// 2.2 um ammonia-hydrate / NH3 ice bands in 10 of 32 spectra (Cartwright et al. 2020, ApJL 898, L22). No abundance
// was fitted. ESTIMATE: Hapke-Mie models of the same band on Miranda use 1-3% NH3 species (DeColibus et al. 2023, PSJ 4).
PLANETARY_RESOURCE
{
    ResourceName = Ammonia
    ResourceType = 0
    PlanetName = Ariel

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 1
        MaxAbundance = 3
        Variance = 50
        Dispersal = 3
    }
}
