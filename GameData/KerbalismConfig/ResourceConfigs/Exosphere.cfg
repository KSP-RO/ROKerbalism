// ============================================================================
// EXOSPHERIC RESOURCES 
// ============================================================================
// ----------------------------------------------------------------------------
// Sources
// ----------------------------------------------------------------------------
// [Bickford07]  Bickford 2007, NIAC Phase II report, "Extraction of Antiparticles Concentrated in Planetary
//  Magnetic Fields": https://www.niac.usra.edu/files/studies/final_report/1071Bickford.pdf
// [Adriani11]   Adriani et al. 2011, ApJL 737 L29, PAMELA trapped antiprotons: https://arxiv.org/abs/1107.4882
// [Roussos18]   Roussos et al. 2018, GRL, Saturn radiation belts start at the A-ring edge (2.27 Rs)
// [Rairden86]   Rairden, Frank & Craven 1986, JGR 91, Earth geocorona (DE-1)
// [PVO-UVS]     Pioneer Venus UVS, Venus exobase hydrogen: https://www.osti.gov/biblio/6050981
// [Donahue82]   Donahue et al. 1982, Science 216, Venus D/H = (1.6 +/- 0.2)e-2
// [Keating80]   Keating et al. 1980, JGR 85, Venus exosphere ~300 K (day)
// [ASPERA-3]    Mars Express ASPERA-3, Mars exobase hydrogen: https://mars-express.cnes.fr/fr/MEX/publis/abstract_publi52.htm
// [Chaffin14]   Chaffin et al. 2014, GRL 41, Mars hydrogen varies 10x seasonally
// [AndHord71]   Anderson & Hord 1971, JGR 76, Mars exosphere 350 K
// [Webster13]   Webster et al. 2013, Science 341, Mars D/H = 6 x SMOW
// [Broadfoot76] Broadfoot et al. 1976, GRL 3, Mercury exosphere (Mariner 10)
// [Quemerais23] Quemerais et al. 2023, JGR Planets, Mercury helium (BepiColombo PHEBUS)
// [MercFS]      NASA Mercury Fact Sheet: https://nssdc.gsfc.nasa.gov/planetary/factsheet/mercuryfact.html
// [MoonFS]      NASA Moon Fact Sheet: https://nssdc.gsfc.nasa.gov/planetary/factsheet/moonfact.html
// [Benna15]     Benna et al. 2015, GRL 42, lunar helium ~80% solar wind (LADEE)
// [Stern13]     Stern et al. 2013, Icarus 226, lunar H2 (LRO/LAMP)
// [ApolloSWC]   Apollo Solar Wind Composition foils, 3He/4He = 4.2e-4 (Geiss et al. 1972)
// [Williams17]  Williams et al. 2017, Icarus 283, lunar night < 100 K (Diviner)
//
// Units: gases % = density [cm^-3] x 1e-6. Antimatter % = density [ng/km^3] x 1e8.
// Bands: centre = MinAltitude x radius, fading linearly to zero at +/- MinRange x radius.
// Band half-width = 2 scale heights at the cited temperature.

// ============================================================================
// ANTIMATTER
// ============================================================================

// Everywhere: cosmic-ray antiproton background, 2.7e-14 ng/km^3 (from [Bickford07] Table 4: 4 g/yr through 11 Re).
// Planet belts [Bickford07][Adriani11] refill too slowly to matter, except Saturn's (below).
GLOBAL_RESOURCE
{
	ResourceName = Antimatter
	ResourceType = 3
	Distribution
	{
		PresenceChance = 100
		MinAbundance = 0.0000027
		MaxAbundance = 0.0000027
		Variance = 0
		Dispersal = 0
	}
}

// SATURN: ~400 ug trapped, refilled every few years [Bickford07]. Belt from the A ring (2.27 Rs) [Roussos18]
// to Enceladus (3.95 Rs, estimate) = 82,444-183,695 km altitude.
PLANETARY_RESOURCE
{
	ResourceName = Antimatter
	ResourceType = 3
	PlanetName = Saturn
	Distribution
	{
		PresenceChance = 100
		MinAbundance = 0.00002835
		MaxAbundance = 0.00002835
		Variance = 0
		Dispersal = 0
		MinAltitude = 2.44776 // centre 133,070 km
		MaxAltitude = 2.44776
		MinRange = 0.93125 // +/- 50,626 km
		MaxRange = 0.93125
	}
}

