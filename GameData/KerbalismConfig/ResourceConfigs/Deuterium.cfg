// ============================================================================
// DEUTERIUM (FFT fusion fuel)
// Gas giants: deuterium carried as HD, LqdDeuterium = 2 x D/H x H2 fraction of the atmosphere.
// ============================================================================

// ----------------------------------------------------------------------------
// References
// ----------------------------------------------------------------------------
// Mahaffy et al. 1998, Space Sci. Rev. 84: https://doi.org/10.1023/a:1005091806594
// Lellouch et al. 2001, A&A 370: https://doi.org/10.1051/0004-6361:20010259
// Feuchtgruber et al. 2013, A&A 551: https://doi.org/10.1051/0004-6361/201220857

// JUPITER
// source: Galileo Probe GPMS, Mahaffy et al. 1998 (Space Sci. Rev. 84): He3/He4 = 1.66e-4, D/H = 2.6e-5
PLANETARY_RESOURCE
{
    ResourceName = LqdDeuterium
    ResourceType = 2
    PlanetName = Jupiter

    Distribution
    {
        PresenceChance = 100
        MinAbundance = 0.0043
        MaxAbundance = 0.0047
        Variance = 0
        Dispersal = 0
    }
}

